  registerPage({ id: 'info', title: 'infoTitle', info: 'infoSelf', langRerender: true, render: renderInfo });

  // 自分自身を 1 段深い階層として開く。アドレスバーには長いファイルのパスではなく about:this と出す
  function renderSelf(tab) {
    renderUrl(tab, selfUrl(depth + 1));
    setMeta(tab, '3D Browser', 'about:this');
  }
  registerPage({ id: 'this', title: () => '3D Browser', info: 'infoThis', render: renderSelf });

  // ---------- 表示方式 ----------
  // 外のサイトを表示する部分。表示方式を差し替えられるよう、同じ形の窓口にそろえておく
  //   element: 表示領域に置く要素 / open(url, { referrer }): 開く / resize(w, h): 表示領域の大きさが変わった / destroy(): 片付け
  // referrer: どのサイトから開いたか (サイト名だけ) を送る。普段は送らない
  function createIframeView() {
    const frame = document.createElement('iframe');
    return {
      element: frame,
      open(url, { referrer = false } = {}) {
        frame.referrerPolicy = referrer ? 'strict-origin-when-cross-origin' : 'no-referrer';
        frame.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
        frame.src = url;
      },
      resize() {},  // iframe は表示領域に合わせて自動で大きさが変わる
      destroy() { frame.remove(); },
    };
  }
  const createView = createIframeView;  // 今の表示方式

  // YouTube の動画ページの URL を埋め込み用に変える (動画ページは iframe での表示を拒否されるため)。
  // 埋め込みはリファラー (サイト名) が無いと「エラー 153」になる。file:// で開いたときは送られないので表示できない
  function youtubeEmbed(url) {
    let u;
    try { u = new URL(url); } catch { return null; }
    const host = u.hostname.replace(/^(www|m)\./, '');
    let id = null;
    if (host === 'youtu.be') id = u.pathname.slice(1);
    else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
      id = u.searchParams.get('v') || u.pathname.match(/^\/(?:embed|shorts|live)\/([\w-]+)/)?.[1];
    }
    if (!id || !/^[\w-]{6,}$/.test(id)) return null;
    // 再生を始める位置 (t=90, t=1m30s)
    const tm = (u.searchParams.get('t') || u.searchParams.get('start') || '').match(/^(?:(\d+)h)?(?:(\d+)m)?(\d+)?s?$/);
    const start = tm ? (+tm[1] || 0) * 3600 + (+tm[2] || 0) * 60 + (+tm[3] || 0) : 0;
    return `https://www.youtube.com/embed/${id}${start ? `?start=${start}` : ''}`;
  }

  function renderUrl(tab, url) {
    // new URL() は日本語ドメインを xn--… に変換してしまうので、文字列から取り出す
    const host = url.match(/^[a-z]+:\/\/([^/?#:]+)/i)?.[1] ?? url;
    // アドレスバーには %E4%BD%9C… のようなエンコードを日本語に戻して表示する
    let shown = url;
    try { shown = decodeURI(url); } catch {}
    setMeta(tab, isSelf(url) ? '3D Browser' : host || url, shown);

    const view = createView();
    tab.pane.appendChild(view.element);
    const yt = youtubeEmbed(url);  // YouTube は埋め込み用の URL で開き、サイト名だけ送る (アドレスバーは元の URL のまま)
    view.open(yt || url, { referrer: !!yt });
    // 表示領域の大きさが変わったら伝える
    const ro = new ResizeObserver(() => view.resize(tab.pane.clientWidth, tab.pane.clientHeight));
    ro.observe(tab.pane);
    tab.cleanups.push(() => { ro.disconnect(); view.destroy(); });
    if (isSelf(url) || yt) return;  // 自分自身と YouTube は表示できるので案内は不要

    // 埋め込み拒否 (X-Frame-Options / CSP) はブラウザから検知できないため常に案内を出す
    const notice = document.createElement('div');
    notice.className = 'notice';
    notice.innerHTML = `<span data-i18n="embedNotice">${t('embedNotice')}</span>
      <a href="${url}" target="_blank" rel="noopener" data-i18n="openNewTab">${t('openNewTab')}</a>
      <button data-i18n-title="close" title="${t('close')}">✕</button>`;
    notice.querySelector('button').addEventListener('click', () => notice.remove());
    tab.pane.appendChild(notice);
  }

  async function renderSearch(tab, s) {
    setMeta(tab, t('searchTitle', s), s);
    const page = document.createElement('div');
    page.className = 'page';
    page.innerHTML = `<div class="msg">${t('searching')}</div>`;
    tab.pane.appendChild(page);

    const params = new URLSearchParams({
      action: 'query', format: 'json', origin: '*',
      generator: 'search', gsrsearch: s, gsrlimit: '15',
      prop: 'pageimages|extracts', piprop: 'thumbnail', pithumbsize: '144',
      exintro: '1', explaintext: '1', exsentences: '3', exlimit: 'max',
    });
    try {
      const res = await fetch(`${wikiBase()}/w/api.php?${params}`);
      const data = await res.json();
      if (page.parentNode !== tab.pane) return;  // 結果が届く前に別のページへ移った
      const pages = Object.values(data.query?.pages || {}).sort((a, b) => a.index - b.index);
      if (!pages.length) {
        page.innerHTML = `<div class="msg">${t('noResults', escapeHtml(s))}</div>`;
        return;
      }
      const list = document.createElement('div');
      list.className = 'results';
      list.innerHTML = `<div class="meta">${t('resultsMeta', pages.length)}</div>`;
      for (const p of pages) {
        const url = `${wikiBase()}/wiki/${encodeURIComponent(p.title.replace(/ /g, '_'))}`;
        const item = document.createElement('div');
        item.className = 'result';
        item.innerHTML = `
          ${p.thumbnail ? `<img src="${p.thumbnail.source}" alt="">` : '<div class="noimg"></div>'}
          <div>
            <div class="url">${escapeHtml(decodeURIComponent(url))}</div>
            <h3>${escapeHtml(p.title)}</h3>
            <p>${escapeHtml(p.extract || '')}</p>
          </div>`;
        item.addEventListener('click', () => navigate(tab, url));
        list.appendChild(item);
      }
      page.innerHTML = '';
      page.appendChild(list);
    } catch (e) {
      page.innerHTML = `<div class="msg">${t('searchFailed', escapeHtml(String(e)))}</div>`;
    }
  }

  // ---------- browser UI ----------
  const BROWSER_HTML = `
    <div class="tabs">
      <div class="dots"><button class="close-window" data-i18n-title="close">×</button><button class="min-window" data-i18n-title="minimize">−</button><button class="max-window" data-i18n-title="maximize">＋</button></div>
      <div class="tab-list"></div>
      <button class="new-tab" data-i18n-title="newTab">+</button>
    </div>
    <div class="toolbar">
      <button class="back-btn" data-i18n-title="back" disabled>&#8592;</button>
      <button class="fwd-btn" data-i18n-title="forward" disabled>&#8594;</button>
      <button class="reload-btn" data-i18n-title="reload">&#8635;</button>
      <button class="home-btn" data-i18n-title="home">&#8962;</button>
      <input class="address" type="text" autocomplete="off" spellcheck="false"
             data-i18n-placeholder="addressPlaceholder">
    </div>
    <div class="panes"></div>`;

  // face の中にブラウザを作る。タブがすべてなくなったら onEmpty を呼ぶ
  function createBrowser(face, { onEmpty, squash = false }) {
    face.classList.add('browser');
    let root = face;
    if (squash) {
      // 短い辺 (厚み) が SIDE_W になるようにレイアウトし、縦横同じ倍率で面の大きさまで縮める。
      // 長い辺は縮めたときに面の長さになるよう逆算する
      // (左右の面はとても縦長、上下の面はとても横長のブラウザになる)
      root = document.createElement('div');
      root.className = 'squash';
      const fit = () => {
        const s = Math.min(face.offsetWidth, face.offsetHeight) / SIDE_W;
        root.style.width = `${face.offsetWidth / s}px`;
        root.style.height = `${face.offsetHeight / s}px`;
        root.style.transform = `scale(${s})`;
      };
      fit();
      new ResizeObserver(fit).observe(face);  // ブラウザの大きさを変えたら縮め方も変える
      face.prepend(root);
    }
    root.insertAdjacentHTML('afterbegin', BROWSER_HTML);
    applyLang(root);
    const q = (sel) => face.querySelector(sel);
    const tabList = q('.tab-list'), panes = q('.panes'), address = q('.address');
    const backBtn = q('.back-btn'), fwdBtn = q('.fwd-btn');

    const browser = {
      face, tabs: [], active: null,

      addTab(tab) {
        tab.browser = browser;
        browser.tabs.push(tab);
        tabList.appendChild(tab.label);
        panes.appendChild(tab.pane);
        browser.activate(tab);
      },

      activate(tab) {
        browser.active = tab;
        for (const t of browser.tabs) {
          t.label.classList.toggle('active', t === tab);
          t.pane.hidden = t !== tab;
        }
        browser.sync(tab);
      },

      // タブを取り外す (移動にも使う)。閉じたタブの隣を表示する
      removeTab(tab) {
        const i = browser.tabs.indexOf(tab);
        browser.tabs.splice(i, 1);
        tab.label.remove();
        tab.pane.remove();
        tab.browser = null;
        if (!browser.tabs.length) return onEmpty();
        if (browser.active === tab) browser.activate(browser.tabs[Math.min(i, browser.tabs.length - 1)]);
      },

      closeTab(tab) {
        disposePage(tab);
        browser.removeTab(tab);
      },

      // アドレスバーと戻る/進むボタンを表示中のタブに合わせる
      sync(tab) {
        if (tab !== browser.active) return;
        face.classList.toggle('glass', !!tab.glass);  // 表示中のページがガラスなら、面にも印を付ける
        if (document.activeElement !== address) address.value = tab.addr;
        backBtn.disabled = tab.index <= 0;
        fwdBtn.disabled = tab.index >= tab.history.length - 1;
      },
    };
    face._browser = browser;

    address.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) { navigate(browser.active, address.value); address.blur(); }
    });
    address.addEventListener('focus', () => address.select());
    backBtn.addEventListener('click', () => {
      const t = browser.active;
      if (t.index > 0) { t.index--; render(t); }
    });
    fwdBtn.addEventListener('click', () => {
      const t = browser.active;
      if (t.index < t.history.length - 1) { t.index++; render(t); }
    });
    q('.reload-btn').addEventListener('click', () => render(browser.active));
    q('.home-btn').addEventListener('click', () => {
      const t = browser.active;
      t.history.splice(t.index + 1); t.history.push(null); t.index = t.history.length - 1;
      render(t);
    });
    q('.new-tab').addEventListener('click', () => browser.addTab(createTab()));
    q('.close-window').addEventListener('click', onEmpty);  // タブごとブラウザを閉じる
    q('.min-window').addEventListener('click', () => toggleSizeMode('min'));
    q('.max-window').addEventListener('click', () => toggleSizeMode('max'));
    addResizeGrip(face);
    return browser;
  }

  function moveTab(tab, to) {
    if (tab.browser === to) return;
    tab.browser.removeTab(tab);
    to.addTab(tab);
  }

  // ---------- face browsers ----------
  // ブラウザにできる面。側面は厚みに合わせて縮め、前面・背面はそのままの大きさで開く
  const OPENABLE = '.front, .side, .back';
  const FACING = { front: [0, 0], right: [-8, -72], left: [-8, 72], top: [-72, 0], bottom: [72, 0], back: [-8, 180] };

  function makeBrowser(face) {
    return createBrowser(face, { onEmpty: () => closeFace(face), squash: face.classList.contains('side') });
  }

  function openFace(face, tab = createTab()) {
    makeBrowser(face).addTab(tab);
    // 開いた面がこちらを向くように回す
    const [trx, try_] = FACING[Object.keys(FACING).find((c) => face.classList.contains(c))];
    turnTo(trx, try_, sideFitZoom(face));
  }

  // 側面・上下の面はこちらを向くと手前に来て、遠近で大きく見える。右下のつまみまで画面に収まるよう、
  // はみ出すときだけ縮小する (はみ出さなければ今の倍率のまま。正面・背面は undefined = 変えない)
  function sideFitZoom(face) {
    const has = (c) => face.classList.contains(c);
    const lr = has('left') || has('right'), tb = has('top') || has('bottom');
    if (!lr && !tb) return undefined;
    const P = parseFloat(getComputedStyle(scene).perspective) || 2200;
    // 面の長い辺・その辺が収まるべき画面の長さ・面が手前に出てくる距離 (scale は z を拡大しないので倍率はかけない)
    const [len, room, near] = lr ? [boxH, innerHeight, boxW / 2] : [boxW, innerWidth, boxH / 2];
    const grow = P / (P - near * Math.sin(72 * Math.PI / 180));  // FACING の 72° 回したときの遠近の拡大
    const fit = room * 0.72 / (len * grow * fitScale() / zoom);
    return Math.min(zoom, fit);
  }

  // ブラウザを閉じて元の面に戻す。タブが残っていれば一緒に捨てる
  function closeFace(face) {
    for (const tab of face._browser?.tabs || []) disposePage(tab);
    face.classList.remove('browser', 'glass');
    face._browser = null;
    // 陰・ロゴ・大きさを変えるつまみは残す
    const keep = ['shade', 'logo', 'resize-grip', 'resize-probe'];
    for (const el of [...face.children]) {
      if (!keep.some((c) => el.classList.contains(c))) el.remove();
    }
  }

  // ---------- 3D rotation ----------
  let rx = -10, ry = 22;          // 現在の角度 (deg)
  let rz = 0;                     // 平行回転 (画面に対して時計回り = +)
  let vx = 0, vy = 0, vz = 0;     // 慣性
  let zoom = 1;
  let dragging = false, lastX = 0, lastY = 0, lastT = 0;
  let down = null;                // クリック判定用: 押した位置と要素
  let target = null;              // 自動で回すときの目標 { rx, ry, rz, zoom? }

  const ROT = () => `rotateZ(${rz}deg) rotateX(${rx}deg) rotateY(${ry}deg)`;

  const faces = [
    ['.front',  [0, 0, 1]], ['.back',   [0, 0, -1]],
    ['.right',  [1, 0, 0]], ['.left',   [-1, 0, 0]],
    ['.top',    [0, -1, 0]], ['.bottom', [0, 1, 0]],
  ].map(([sel, n]) => {
    const el = box.querySelector(sel);
    return { el, shade: el.querySelector('.shade'), n };
  });
  const L = normalize([-0.35, -0.55, 1]);  // 左上手前からの光

  function normalize(v) { const l = Math.hypot(...v); return v.map((x) => x / l); }

  function fitScale() {
    return Math.min(innerWidth * 0.82 / W, innerHeight * 0.78 / H) * zoom;
  }

  function apply() {
    box.style.transform = `scale(${fitScale()}) ${ROT()}`;
    // CSS は rotateY → rotateX → rotateZ の順で点に作用する
    const a = ry * Math.PI / 180, b = rx * Math.PI / 180, c = rz * Math.PI / 180;
    for (const f of faces) {
      const [x, y, z] = f.n;
      const x1 = x * Math.cos(a) + z * Math.sin(a);
      const z1 = -x * Math.sin(a) + z * Math.cos(a);
      const y2 = y * Math.cos(b) - z1 * Math.sin(b);
      const z2 = y * Math.sin(b) + z1 * Math.cos(b);
      const x3 = x1 * Math.cos(c) - y2 * Math.sin(c), y3 = x1 * Math.sin(c) + y2 * Math.cos(c);
      const lit = Math.max(0, x3 * L[0] + y3 * L[1] + z2 * L[2]);
      // ブラウザになっている面は読みやすさ優先で陰を弱くする
      const k = f.el.classList.contains('browser') ? 0.25 : 0.5;
      f.shade.style.opacity = ((1 - lit) * k).toFixed(3);
    }
  }

  // 平行回転は指定しなければ 0° (まっすぐ) に戻す
  // 操作パネルのロックを外す (操作パネルの処理は後ろで定義されるが、呼ばれるのは起動後の操作のときだけ)
  function stopRollLatch() { roll.setLatch(0); }
  // ほかの操作 (ピンチ・ホイール・リセットなど) で外すときは、すぐに範囲の中へ戻す
  function stopZoomLatch() {
    zoomer.setLatch(0);
    zoomReturn = false;
    zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom));
    scene.style.opacity = '';
  }
  function stopLatches() { stopRollLatch(); stopZoomLatch(); stopStickLatch(); }
  function turnTo(trx, try_, tzoom, trz = 0) {
    // 向きを目標へ動かすので、スティックのロックは外す (大きさも動かすなら ＋/− のロックも)
    stopStickLatch();
    if (tzoom !== undefined) stopZoomLatch();
    target = { rx: trx, ry: try_, rz: trz, zoom: tzoom };
    vx = vy = vz = 0;
  }

  // ---------- ブラウザの大きさ ----------
  // 見た目の倍率は元の大きさ (W × H) を基準に固定しているので、大きくすると見た目も大きくなる
  // (実際のウィンドウと同じ)。大きさは覚えず、開くたびに元の大きさから始まる
  const MIN_W = 320, MIN_H = 220, MAX_W = 4000, MAX_H = 6000;
  const TALL_W = 420, TALL_H = 2600;  // 超縦長
  // 厚み: 元は D0。側面・上下の面のつまみで厚くできる。上限は幅・高さの短いほう (立方体まで)
  const D0 = 56;
  let boxW = W, boxH = H, boxD = D0;
  let sizeMode = 'normal', savedSize = null;  // 最大化・最小化の前の大きさ
  let sizeAnim = 0;

  function applySize() {
    boxD = Math.max(D0, Math.min(boxD, boxW, boxH));  // 幅や高さを小さくしたら、厚みも一緒に縮める
    document.documentElement.style.setProperty('--W', `${boxW}px`);
    document.documentElement.style.setProperty('--H', `${boxH}px`);
    document.documentElement.style.setProperty('--D', `${boxD}px`);
  }
  // animate: なめらかに変える (約 0.35 秒)。d (厚み) を省くと今の厚みのまま
  function setSize(w, h, animate = false, d = boxD) {
    w = Math.round(Math.min(MAX_W, Math.max(MIN_W, w)));
    h = Math.round(Math.min(MAX_H, Math.max(MIN_H, h)));
    d = Math.round(Math.max(D0, Math.min(d, w, h)));
    cancelAnimationFrame(sizeAnim);
    if (!animate) { boxW = w; boxH = h; boxD = d; applySize(); return; }
    const w0 = boxW, h0 = boxH, d0 = boxD, t0 = performance.now();
    (function step(now) {
      const k = Math.min(1, (now - t0) / 350), e = 1 - (1 - k) ** 3;
      boxW = w0 + (w - w0) * e; boxH = h0 + (h - h0) * e; boxD = d0 + (d - d0) * e;
      applySize();
      if (k < 1) sizeAnim = requestAnimationFrame(step);
    })(t0);
  }
  // 拡大縮小していないときの見た目の倍率
  const baseScale = () => Math.min(innerWidth * 0.82 / W, innerHeight * 0.78 / H);

  // 緑 = 最大化 (画面いっぱい) / 黄 = 最小化。もう一度押すと元の大きさに戻る
  function toggleSizeMode(mode) {
    if (sizeMode === mode) {
      sizeMode = 'normal';
      setSize(savedSize.w, savedSize.h, true);
      return;
    }
    if (sizeMode === 'normal') savedSize = { w: boxW, h: boxH };
    sizeMode = mode;
    if (mode === 'max') {
      const s = baseScale();
      setSize(innerWidth * 0.96 / s, innerHeight * 0.9 / s, true);
      turnTo(0, 0, 1);  // 正面を向けて画面いっぱいに見せる
    } else {
      setSize(360, 240, true);
    }
  }
  addEventListener('resize', () => { if (sizeMode === 'max') { sizeMode = 'normal'; toggleSizeMode('max'); } });

  // 超縦長: 縦に長い箱を正面に向け、全体が見えるまで引く
  // プリセットの大きさにして正面を向け、全体が見える大きさまで引く (大きいときだけ)
  function setPreset(w, h, mode = 'preset') {
    if (sizeMode === 'normal') savedSize = { w: boxW, h: boxH };
    sizeMode = mode;
    setSize(w, h, true);
    const s = baseScale();
    turnTo(0, 0, Math.max(0.15, Math.min(1, innerWidth * 0.9 / (w * s), innerHeight * 0.85 / (h * s))));
  }
  const setTall = () => setPreset(TALL_W, TALL_H, 'tall');

  // 「サイズ」メニュー
  const SIZE_PRESETS = [
    ['sizePhone', 390, 844], ['sizeTablet', 820, 1180], ['sizeLaptop', W, H],
    ['sizeWide', 1400, 600], ['sizeSquare', 800, 800], ['sizeTall', TALL_W, TALL_H], ['sizeMax'],
  ];
  const sizeMenu = $('sizeMenu'), sizeBtn = $('sizeBtn');
  function renderSizeMenu() {
    sizeMenu.innerHTML = '';
    for (const [key, w, h] of SIZE_PRESETS) {
      const b = document.createElement('button');
      b.setAttribute('role', 'menuitem');
      b.innerHTML = `<span>${t(key)}</span><small>${w ? `${w} × ${h}` : ''}</small>`;
      if (w && Math.round(boxW) === w && Math.round(boxH) === h) b.classList.add('current');
      b.addEventListener('click', () => {
        sizeMenu.hidden = true;
        if (!w) { if (sizeMode !== 'max') toggleSizeMode('max'); return; }
        if (w === W && h === H) { resetAll(); return; }  // 標準の大きさ = リセットと同じ
        setPreset(w, h, key === 'sizeTall' ? 'tall' : 'preset');
      });
      sizeMenu.appendChild(b);
    }
  }
  sizeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (sizeMenu.hidden) renderSizeMenu();
    sizeMenu.hidden = !sizeMenu.hidden;
  });
  // メニューの外を押すか Esc で閉じる
  addEventListener('pointerdown', (e) => {
    if (!sizeMenu.hidden && !sizeMenu.contains(e.target) && e.target !== sizeBtn) sizeMenu.hidden = true;
  }, true);
  addEventListener('keydown', (e) => { if (e.key === 'Escape') sizeMenu.hidden = true; });

  function resetAll() {
    stopLatches();
    resetSeeThrough();
    sizeMode = 'normal';
    setSize(W, H, true, D0);
    turnTo(0, 0, 1);
  }

  // 右下の角のつまみ。箱を傾けていても、マウスの動きを面の上の動きに直して大きさを変える。
  // その面に見えている 2 辺を変える: 正面・背面は幅と高さ、左右の面は厚みと高さ、上下の面は幅と厚み
  // ブラウザにしていない (閉じている) 面にも付ける。面を閉じても残す
  function addResizeGrip(face) {
    if (face.querySelector(':scope > .resize-grip')) return;  // 付いていれば何もしない
    const has = (c) => face.classList.contains(c);
    const axes = has('left') || has('right') ? ['d', 'h'] : has('top') || has('bottom') ? ['w', 'd'] : ['w', 'h'];
    const grip = document.createElement('div');
    grip.className = 'resize-grip';
    grip.dataset.i18nTitle = 'resizeTip';
    grip.title = t('resizeTip');
    // 面の上の 3 点 (右下の角、そこから左に 100px、上に 100px) が画面のどこに映るかで、
    // つまみのあたりでの面の向きを調べる (遠近感があるので、つまみの近くで測る)
    const probes = [[0, 0], [100, 0], [0, 100]].map(([x, y]) => {
      const p = document.createElement('div');
      p.className = 'resize-probe';
      p.style.right = `${x}px`; p.style.bottom = `${y}px`;
      face.appendChild(p);
      return p;
    });
    face.appendChild(grip);
    let last = null;
    grip.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.stopPropagation();
      grip.setPointerCapture(e.pointerId);
      last = { x: e.clientX, y: e.clientY };
      sizeMode = 'normal';
      document.body.classList.add('resizing');
    });
    grip.addEventListener('pointermove', (e) => {
      if (!last) return;
      const [p0, p1, p2] = probes.map((p) => p.getBoundingClientRect());
      const ex = [(p0.x - p1.x) / 100, (p0.y - p1.y) / 100], ey = [(p0.x - p2.x) / 100, (p0.y - p2.y) / 100];
      const dx = e.clientX - last.x, dy = e.clientY - last.y;
      const det = ex[0] * ey[1] - ex[1] * ey[0];
      last = { x: e.clientX, y: e.clientY };
      if (Math.abs(det) < 1e-3) return;  // 面が真横を向いているときは動かせない
      const u = (dx * ey[1] - dy * ey[0]) / det, v = (ex[0] * dy - ex[1] * dx) / det;
      // 箱は中心を基準に広がるので、角がカーソルについてくるよう 2 倍にする
      const size = { w: boxW, h: boxH, d: boxD };
      size[axes[0]] += u * 2;
      size[axes[1]] += v * 2;
      setSize(size.w, size.h, false, size.d);
    });
    const end = () => { last = null; document.body.classList.remove('resizing'); };
    grip.addEventListener('pointerup', end);
    grip.addEventListener('pointercancel', end);
  }

  // 平行回転のドラッグ: 画面の中心からこの距離より外の背景をつかむと平行回転になる。
  // 縮小して箱が小さいときは、その分内側の円も小さくする
  let dragMode = 'tilt', lastAngle = 0;
  const rollRadius = () => 0.4 * Math.min(innerWidth, innerHeight) * Math.min(1, zoom);
  const rollGuide = $('rollGuide');
  function showRollGuide(on) {
    if (on) {
      const r = rollRadius();
      Object.assign(rollGuide.style, { width: `${r * 2}px`, height: `${r * 2}px` });
    }
    rollGuide.classList.toggle('show', on);
  }

  // 操作できる要素やページ表示部分の上では回転しない
  const interactive = (el) => el.closest('input, button, a, .panes, .tab, .resize-grip');

  // ---------- tab drag ----------
  // タブをドラッグして、別のブラウザや閉じている側面へ移動する
  let tabDrag = null;   // { tab, x, y, ghost, over }

  function dropTargetAt(x, y) {
    const face = document.elementFromPoint(x, y)?.closest(OPENABLE);
    if (!face) return null;
    if (face.classList.contains('browser')) return face._browser === tabDrag.tab.browser ? null : face;
    return face;  // 閉じている側面
  }

  function setDropTarget(face) {
    if (tabDrag.over === face) return;
    tabDrag.over?.classList.remove('drop-target');
    face?.classList.add('drop-target');
    tabDrag.over = face;
  }

  // ---------- pinch (スマホの 2 本指で拡大縮小・ひねって平行回転) ----------
  // 回転・タブのドラッグより先に受けて、2 本目の指が触れたらそちらを取り消す
  const touches = new Map();   // pointerId -> { x, y }
  let pinch = null;            // { d0, z0 }
  const touchDist = () => {
    const [a, b] = [...touches.values()];
    return Math.hypot(a.x - b.x, a.y - b.y) || 1;
  };
  const touchAngle = () => {
    const [a, b] = [...touches.values()];
    return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
  };
  scene.addEventListener('pointerdown', (e) => {
    // 1 本目がページの中 (スクロールや操作) なら対象外。2 本目はどこに触れてもよい
    if (e.pointerType !== 'touch' || (!touches.size && e.target.closest('.panes'))) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size !== 2) return;
    e.stopImmediatePropagation();
    // 1 本目で始まっていた回転やタブのドラッグはやめる
    dragging = false; down = null; vx = vy = vz = 0;
    showRollGuide(false);
    if (tabDrag) { tabDrag.ghost?.remove(); tabDrag.over?.classList.remove('drop-target'); tabDrag = null; }
    document.body.classList.remove('dragging');
    stopRollLatch();
    stopZoomLatch();
    pinch = { d0: touchDist(), z0: zoom, a0: touchAngle(), r0: rz };
    target = null;
  });
  scene.addEventListener('pointermove', (e) => {
    if (!touches.has(e.pointerId)) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!pinch || touches.size < 2) return;
    e.stopImmediatePropagation();
    zoom = Math.min(2.5, Math.max(0.15, pinch.z0 * touchDist() / pinch.d0));
    rz = pinch.r0 + angleDiff(touchAngle(), pinch.a0);  // ひねった分だけ平行回転
    apply();
  });
  const endTouch = (e) => {
    if (!touches.delete(e.pointerId)) return;
    if (pinch) {
      e.stopImmediatePropagation();  // 指を離しても「クリック」扱いにしない
      if (touches.size < 2) pinch = null;
    }
  };
  scene.addEventListener('pointerup', endTouch);
  scene.addEventListener('pointercancel', endTouch);

  scene.addEventListener('pointerdown', (e) => {
    const label = e.target.closest('.tab');
    if (e.button === 0 && label && !e.target.closest('.close')) {
      tabDrag = { tab: label._tab, x: e.clientX, y: e.clientY, ghost: null, over: null };
      scene.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button !== 0 || interactive(e.target)) return;
    dragging = true; target = null;
    vx = vy = vz = 0;
    lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
    down = { x: e.clientX, y: e.clientY, el: e.target };
    // 箱の外の背景で、画面の中心から離れた所をつかんだら平行回転 (つまみを回すように)
    const cx = innerWidth / 2, cy = innerHeight / 2;
    dragMode = !e.target.closest('.face') && Math.hypot(e.clientX - cx, e.clientY - cy) > rollRadius() ? 'roll' : 'tilt';
    if (dragMode === 'roll') {
      stopRollLatch();  // 手でロールしたら、回し続けるのをやめる
      lastAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
      showRollGuide(true);
    } else {
      stopStickLatch();  // 手で傾けたら、スティックで回し続けるのをやめる
    }
    scene.setPointerCapture(e.pointerId);
    document.body.classList.add('dragging');
  });
  scene.addEventListener('pointermove', (e) => {
    if (tabDrag) {
      if (!tabDrag.ghost) {
        if (Math.hypot(e.clientX - tabDrag.x, e.clientY - tabDrag.y) < 5) return;
        tabDrag.ghost = document.createElement('div');
        tabDrag.ghost.className = 'tab-ghost';
        tabDrag.ghost.textContent = tabDrag.tab.title;
        document.body.appendChild(tabDrag.ghost);
        document.body.classList.add('dragging');
      }
      tabDrag.ghost.style.transform = `translate(${e.clientX + 12}px, ${e.clientY + 8}px)`;
      setDropTarget(dropTargetAt(e.clientX, e.clientY));
      return;
    }
    if (!dragging) {
      // マウスを乗せただけのとき: 平行回転になる場所ならカーソルを回転の矢印にする
      const roll = e.pointerType === 'mouse' && !e.target.closest('.face') &&
        Math.hypot(e.clientX - innerWidth / 2, e.clientY - innerHeight / 2) > rollRadius();
      document.body.classList.toggle('roll-zone', roll);
      return;
    }
    const now = performance.now();
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    const dt = Math.max(1, now - lastT);
    if (dragMode === 'roll') {
      // 画面の中心のまわりで、つかんだ点が回った角度だけ回す
      const a = Math.atan2(e.clientY - innerHeight / 2, e.clientX - innerWidth / 2);
      const d = angleDiff(a * 180 / Math.PI, lastAngle * 180 / Math.PI);
      rz += d;
      vz = d / dt * 16;
      lastAngle = a;
      lastX = e.clientX; lastY = e.clientY; lastT = now;
      apply();
      return;
    }
    ry += dx * 0.4; rx -= dy * 0.4;
    vy = dx * 0.4 / dt * 16; vx = -dy * 0.4 / dt * 16;
    lastX = e.clientX; lastY = e.clientY; lastT = now;
    apply();
  });
  function endTabDrag(e) {
    const { tab, ghost, over } = tabDrag;
    tabDrag = null;
    if (!ghost) {  // 動かさずに離した = タブの切り替え
      tab.browser.activate(tab);
      return;
    }
    ghost.remove();
    over?.classList.remove('drop-target');
    document.body.classList.remove('dragging');
    if (e.type !== 'pointerup' || !over) return;
    if (over.classList.contains('browser')) {
      moveTab(tab, over._browser);
    } else {
      tab.browser.removeTab(tab);
      openFace(over, tab);
    }
  }

  const endDrag = (e) => {
    if (tabDrag) return endTabDrag(e);
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('dragging');
    showRollGuide(false);
    if (performance.now() - lastT > 80) vx = vy = vz = 0;  // 止めてから離した場合は慣性なし
    // ほとんど動かさずに離した = クリック。側面ならブラウザを開く
    if (e.type === 'pointerup' && down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 4) {
      const side = down.el.closest(OPENABLE);
      if (side && !side.classList.contains('browser')) openFace(side);
    }
    down = null;
  };
  scene.addEventListener('pointerup', endDrag);
  scene.addEventListener('pointercancel', endDrag);

  scene.addEventListener('dblclick', (e) => {
    // 閉じている面のダブルクリックは「開く」操作なので、向きのリセットはしない
    const face = e.target.closest(OPENABLE);
    if (interactive(e.target) || (face && !face.classList.contains('browser'))) return;
    resetAll();
  });

  scene.addEventListener('wheel', (e) => {
    // Ctrl+ホイール / ピンチは、どこでもブラウザ自体の拡大ではなく 3D の拡大縮小にする
    if (!e.ctrlKey && interactive(e.target)) return;
    e.preventDefault();
    stopZoomLatch();
    zoom = Math.min(2.5, Math.max(0.15, zoom * Math.exp(-e.deltaY * 0.001)));
    apply();
  }, { passive: false });

  addEventListener('resize', apply);

  // 角度の差を -180〜180 に収める (最短方向で回すため)
  const angleDiff = (to, from) => ((to - from) % 360 + 540) % 360 - 180;

  function tick() {
    padTick();
    if (!dragging && !padActive()) {
      if (target) {
        const drx = angleDiff(target.rx, rx), dry = angleDiff(target.ry, ry), drz = angleDiff(target.rz, rz);
        rx += drx * 0.12; ry += dry * 0.12; rz += drz * 0.12;
        if (target.zoom !== undefined) zoom += (target.zoom - zoom) * 0.12;
        if (Math.abs(drx) < 0.05 && Math.abs(dry) < 0.05 && Math.abs(drz) < 0.05 &&
            (target.zoom === undefined || Math.abs(zoom - target.zoom) < 0.002)) {
          rx = target.rx; ry = target.ry; rz = target.rz;
          if (target.zoom !== undefined) zoom = target.zoom;
          target = null;
        }
        apply();
      } else if (Math.abs(vx) > 0.01 || Math.abs(vy) > 0.01 || Math.abs(vz) > 0.01) {
        rx += vx; ry += vy; rz += vz;
        vx *= 0.95; vy *= 0.95; vz *= 0.95;
        apply();
      }
    }
    requestAnimationFrame(tick);
  }

  // ---------- 透過 ----------
  // 短く押すとオン・オフ。長押しすると透け具合のスライダーが出て、指を離さずに上下に動かして選ぶ
  // (上ほど透ける)。選んだ透け具合は覚えておく
  const ST_KEY = '3d-browser-see-through';
  const ST_MIN = 0.15, ST_MAX = 1;      // ブラウザの面の不透明度の範囲 (1 = まったく透けない)
  const ST_FACE = 0.2 / 0.55;           // 閉じている面は、ブラウザの面のこの割合 (少し多めに透ける)
  const seeBtn = $('seeThrough'), stSlider = $('stSlider');
  const stTrack = stSlider.querySelector('.st-track');
  const ST_DEFAULT = 0.55;
  let stOpacity = ST_DEFAULT;
  try { const v = parseFloat(localStorage.getItem(ST_KEY)); if (v >= ST_MIN && v <= ST_MAX) stOpacity = v; } catch {}
  function setSeeThrough(v, save = false) {
    stOpacity = Math.min(ST_MAX, Math.max(ST_MIN, v));
    document.documentElement.style.setProperty('--st', stOpacity.toFixed(3));
    document.documentElement.style.setProperty('--st-face', (stOpacity * ST_FACE).toFixed(3));
    // スライダーの表示: 上ほど透ける (k = 1 が一番透明)
    const k = (ST_MAX - stOpacity) / (ST_MAX - ST_MIN);
    stSlider.querySelector('.st-fill').style.height = `${k * 100}%`;
    stSlider.querySelector('.st-knob').style.top = `${(1 - k) * 100}%`;
    stSlider.querySelector('.st-label').textContent = t('stLabel', Math.round((1 - stOpacity) * 100));
    if (save) try { localStorage.setItem(ST_KEY, stOpacity.toFixed(3)); } catch {}
  }
  setSeeThrough(stOpacity);
  onLangChange.push(() => setSeeThrough(stOpacity));
  // リセット: 透過をやめて、透け具合も元に戻す
  function resetSeeThrough() {
    stSlider.hidden = true;
    stSlider.classList.remove('open');
    document.body.classList.remove('see-through');
    setSeeThrough(ST_DEFAULT, true);
  }

  let stPress = null;   // 押している間 { timer, long, moved }
  let stSkipClick = false;  // 長押しのあとの click ではオン・オフしない
  // スライダーを閉じて、選んだ透け具合を覚える
  function closeSlider() {
    stSlider.hidden = true;
    stSlider.classList.remove('open');
    setSeeThrough(stOpacity, true);
  }
  seeBtn.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    // 出したままのスライダーがあるときにボタンを押したら、閉じるだけ
    if (!stSlider.hidden) { closeSlider(); stSkipClick = true; return; }
    seeBtn.setPointerCapture(e.pointerId);
    stPress = { long: false, timer: setTimeout(() => {
      stPress.long = true;
      document.body.classList.add('see-through');  // オフのときに長押ししたらオンにする
      // つまみが指の高さに来るように、スライダーをボタンの上に置く
      stSlider.hidden = false;
      const b = seeBtn.getBoundingClientRect(), w = stSlider.offsetWidth;
      const k = (ST_MAX - stOpacity) / (ST_MAX - ST_MIN);
      const trackTop = stTrack.offsetTop, h = stTrack.offsetHeight;
      let top = e.clientY - trackTop - (1 - k) * h;
      top = Math.min(b.top - stSlider.offsetHeight - 6, top);  // ボタンには重ねない
      stSlider.style.left = `${Math.min(innerWidth - w - 8, b.left + b.width / 2 - w / 2)}px`;
      stSlider.style.top = `${Math.max(8, top)}px`;
      stPress.y = e.clientY;
      stPress.k = k;
      navigator.vibrate?.(15);
    }, 400) };
  });
  seeBtn.addEventListener('pointermove', (e) => {
    if (!stPress?.long) return;
    if (Math.abs(stPress.y - e.clientY) > 3) stPress.moved = true;
    // 押した位置からの上下の動きで変える (上 = 透ける)
    const k = Math.min(1, Math.max(0, stPress.k + (stPress.y - e.clientY) / stTrack.offsetHeight));
    setSeeThrough(ST_MAX - k * (ST_MAX - ST_MIN));
  });
  const stEnd = () => {
    if (!stPress) return;
    clearTimeout(stPress.timer);
    if (stPress.long) {
      stSkipClick = true;
      // 動かしてから離したら閉じる。動かさずに離したら出したままにして、スライダーを直接動かせるようにする
      if (stPress.moved) closeSlider();
      else stSlider.classList.add('open');
    }
    stPress = null;
  };
  // 出したままのスライダー: 押した高さの透け具合にして、そのままドラッグで変える。離すと閉じる
  const stFromY = (y) => {
    const r = stTrack.getBoundingClientRect();
    const k = Math.min(1, Math.max(0, (r.bottom - y) / r.height));
    setSeeThrough(ST_MAX - k * (ST_MAX - ST_MIN));
  };
  let stDrag = false;
  stSlider.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.stopPropagation();
    stSlider.setPointerCapture(e.pointerId);
    stDrag = true;
    stFromY(e.clientY);
  });
  stSlider.addEventListener('pointermove', (e) => { if (stDrag) stFromY(e.clientY); });
  const stDragEnd = () => {
    if (!stDrag) return;
    stDrag = false;
    closeSlider();
  };
  stSlider.addEventListener('pointerup', stDragEnd);
  stSlider.addEventListener('pointercancel', stDragEnd);
  // スライダーの外を押す・Esc で閉じる
  addEventListener('pointerdown', (e) => {
    if (stSlider.classList.contains('open') && !stSlider.contains(e.target) && e.target !== seeBtn) closeSlider();
  }, true);
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && !stSlider.hidden) closeSlider(); });
  seeBtn.addEventListener('pointerup', stEnd);
  seeBtn.addEventListener('pointercancel', stEnd);
  seeBtn.addEventListener('click', () => {
    if (stSkipClick) { stSkipClick = false; return; }
    document.body.classList.toggle('see-through');
  });
  $('resetView').addEventListener('click', () => resetAll());

  // 全画面表示。iPhone の Safari は動画以外の全画面に対応していないので、そのときはボタンを出さない
  const root = document.documentElement;
  const requestFs = root.requestFullscreen || root.webkitRequestFullscreen;
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
  const fsBtn = $('fullscreen');
  if (!requestFs || depth > 0) {
    fsBtn.hidden = true;
  } else {
    fsBtn.addEventListener('click', () => {
      if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else requestFs.call(root);
    });
    // アイコン: 四隅が外を向く = 全画面にする / 内を向く = 全画面をやめる
    const FS_ICON = {
      enter: '<path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5"/>',
      exit: '<path d="M8 3v5H3M16 3v5h5M21 16h-5v5M3 16h5v5"/>',
    };
    const sync = () => {
      const on = !!fsElement();
      fsBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${FS_ICON[on ? 'exit' : 'enter']}</svg>`;
      fsBtn.title = t(on ? 'exitFullscreen' : 'fullscreenTip');
      fsBtn.setAttribute('aria-label', fsBtn.title);
    };
    sync();
    onLangChange.push(sync);
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
  }

  // 日本語 ⇄ English の切り替え
  const langBtn = $('langToggle');
  function setLang(next) {
    lang = next;
    try { localStorage.setItem(LANG_KEY, lang); } catch {}
    document.documentElement.lang = lang;
    langBtn.textContent = t('langToggle');
    langBtn.title = t('langToggleTip');
    applyLang();
    for (const fn of onLangChange) fn();
    // 開いているタブ: 文字だけのページは描き直し、動いているページ (小人など) は題名だけ変える
    for (const label of document.querySelectorAll('.tab')) {
      const tab = label._tab, entry = tab?.history[tab.index];
      if (!tab) continue;
      const def = entry?.type === 'page' && PAGES.get(entry.id);
      if (!entry || entry.type === 'search' || def?.langRerender) render(tab);
      else if (def) setMeta(tab, pageTitle(def), tab.addr);
    }
  }
  langBtn.addEventListener('click', () => setLang(lang === 'ja' ? 'en' : 'ja'));

  // ---------- 操作パネル ----------
  // スティックを倒した向きに回る。中心から遠いほど速い (強さの 1.5 乗に比例)
  const pad = $('pad'), stick = pad.querySelector('.stick'), knob = pad.querySelector('.knob');
  const padShow = $('padShow'), padHint = $('padHint');
  const PAD_SPEED = 220;      // いっぱいに倒したときの回転の速さ (度/秒)
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };
  let stickVec = null;        // スティックを倒している量 { x, y } (-1〜1)。離しているときは null
  let keyVec = { x: 0, y: 0 };  // 矢印キーで倒している量
  // スティックのロック: 倒したままほぼ動かさずに STICK_WAIT 秒たつと外側の輪が現れ、
  // さらに STICK_FILL 秒で一周する。一周してから離すと、その位置 (= 速さ) のまま回り続ける
  const STICK_WAIT = 1, STICK_FILL = 1, STICK_STILL = 0.08;  // STICK_STILL: 「動かしていない」とみなす範囲
  let stickLatch = null;      // ロック中の倒している量 { x, y }。ロックしていないときは null
  let stickStill = 0;         // ほぼ動かさずに倒している時間 (秒)
  let stickAnchor = null;     // じっとしているかを測る基準の位置
  let stickReady = false;     // 輪が一周して、離せばロックできる

  // ⟲⟳ と ＋/− の長押し。押し始めは stages[0] の速さで、STEP 秒ごとにリングが 1 段伸びて速くなる。
  // リングが出ているときに離すと、その段の速さのまま続ける (ロック。ボタンが青くなる)
  // wait: 押してからリングが出る (ロックできるようになる) までの秒数
  const STEP = 0.8;
  function holdGroup(btns, stages, wait = STEP) {
    const g = {
      btns, stages,
      dir: 0,     // 押している向き (0 = 押していない)
      held: 0,    // 押している時間 (秒)
      stage: 0,   // リングの段 (0 = まだリングが出ていない)
      latch: 0,   // ロック中の向き (0 = ロックなし)
      speed: 0,   // ロック中の速さ
      setLatch(dir) {
        const changed = g.latch !== dir;
        g.latch = dir;
        for (const [d, b] of Object.entries(btns)) b.classList.toggle('latched', +d === dir);
        if (changed) g.onLatch?.(dir);
      },
      // 押している間、毎フレーム呼ぶ。リングを伸ばし、今の速さを返す
      hold(dt) {
        g.held += dt;
        const b = btns[g.dir], n = stages.length;
        const stage = g.held < wait ? 0 : Math.min(n, 1 + Math.floor((g.held - wait) / STEP));
        if (stage !== g.stage) {
          g.stage = stage;
          b.classList.toggle('charging', stage > 0);
          navigator.vibrate?.(15);  // 段が上がるたびに軽く振動 (スマホ)
        }
        // リングは 1/3 の位置から現れて、一周までなめらかに伸びる
        if (stage) showRing(b, Math.min(1, (1 + (g.held - wait) / STEP) / n));
        return stages[Math.max(0, stage - 1)];
      },
    };
    for (const [d, b] of Object.entries(btns)) {
      const dir = +d;
      b.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        b.setPointerCapture(e.pointerId);
        firstUse();
        // ロック中の同じボタンを押したら止めるだけ。反対のボタンならロックを外して普通に動かす
        if (g.latch === dir) { g.setLatch(0); return; }
        g.setLatch(0);
        g.dir = dir;
        g.held = 0;
        g.stage = 0;
      });
      // 離したとき: リングが出ていたらその段の速さでロック、出ていなければ止まる
      const stop = (e) => {
        if (!g.dir) return;
        const btn = btns[g.dir];
        btn.classList.remove('charging');
        showRing(btn, 0);
        if (g.stage && e.type === 'pointerup') {
          g.speed = stages[g.stage - 1];
          g.setLatch(g.dir);
        }
        g.dir = 0;
        g.stage = 0;
      };
      b.addEventListener('pointerup', stop);
      b.addEventListener('pointercancel', stop);
    }
    return g;
  }
  const showRing = (b, p) => b.style.setProperty('--p', p);

  // ⟲/⟳ (度/秒)。最高速は眺めやすさ優先で控えめ。速く回したいときは外側の背景を手でドラッグする (上限なし)
  const roll = holdGroup({ '-1': pad.querySelector('.roll-left'), '1': pad.querySelector('.roll-right') }, [10, 20, 30]);
  // ＋/− (1 秒あたり大きさが e^速さ 倍)
  // 拡大縮小は押しっぱなしで使うことが多いので、⟲⟳ よりロックできるまでを長めにする
  const zoomer = holdGroup({ '1': pad.querySelector('.zoom-in'), '-1': pad.querySelector('.zoom-out') }, [0.3, 0.6, 1.0], 1.5);
  // ＋/− のロックはループする: 極大を越えて近づきながら消え、極小より遠くから現れてまた近づく (− は逆向き)
  // 手で拡大縮小できる範囲。ループのときだけ、その外 (LOOP_LO〜LOOP_HI) まで行く。
  // 遠い側は FADE_LO (点のような大きさ) まで小さくなってから消え、近い側は ZOOM_MAX を越えたら消えていく
  const ZOOM_MIN = 0.15, ZOOM_MAX = 2.5;
  const LOOP_LO = 0.01, FADE_LO = 0.03, LOOP_HI = 4;
  let zoomReturn = false;     // ループを止めたあと、範囲の中へなめらかに戻っている途中
  function zoomFade() {
    const fade = zoom > ZOOM_MAX ? 1 - Math.log(zoom / ZOOM_MAX) / Math.log(LOOP_HI / ZOOM_MAX)
      : zoom < FADE_LO ? 1 - Math.log(FADE_LO / zoom) / Math.log(FADE_LO / LOOP_LO) : 1;
    scene.style.opacity = fade < 1 ? Math.max(0, fade).toFixed(3) : '';
  }
  function zoomLoop(dt) {
    zoom *= Math.exp(zoomer.latch * zoomer.speed * dt);
    if (zoom > LOOP_HI) zoom = LOOP_LO * zoom / LOOP_HI;   // 突き抜けたら、遠くから出直す
    if (zoom < LOOP_LO) zoom = LOOP_HI * zoom / LOOP_LO;
    zoomFade();
  }
  // ボタンでループを止めたら、範囲の外にいれば中へなめらかに戻す
  zoomer.onLatch = (dir) => {
    if (!dir) zoomReturn = zoom < ZOOM_MIN || zoom > ZOOM_MAX;
  };
  function zoomBack(dt) {
    const to = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom));
    const d = Math.log(to / zoom);
    if (Math.abs(d) < 0.005) { zoom = to; zoomReturn = false; }
    else zoom *= Math.exp(d * Math.min(1, dt * 4));
    zoomFade();
  }

  let lastPadT = performance.now();
  const padActive = () => !!stickVec || keyVec.x || keyVec.y || zoomer.dir || roll.dir;

  function padTick() {
    const now = performance.now(), dt = Math.min(0.05, (now - lastPadT) / 1000);
    lastPadT = now;
    const v = stickVec || stickLatch || keyVec;
    const m = Math.hypot(v.x, v.y);
    if (m > 0.05) {
      const k = PAD_SPEED * Math.pow(Math.min(1, m), 1.5) / m * dt;
      // 背景のドラッグと同じ向き: 右に倒すと右へ、上に倒すと上へ回る
      ry += v.x * k; rx -= v.y * k;
      target = null;
      // 離したときに少しだけ惰性で回り続けるよう、今の速さを覚えておく (ロック中は惰性を使わない)
      if (stickLatch && !stickVec) vx = vy = 0;
      else { vy = v.x * k; vx = -v.y * k; }
      apply();
    }
    if (stickVec) chargeStick(dt);
    if (roll.dir) {
      rz += roll.dir * roll.hold(dt) * dt;
      vz = 0;  // 離したらその場で止まる (惰性で行き過ぎないように)
      target = null;
      apply();
    } else if (roll.latch) {
      rz += roll.latch * roll.speed * dt;  // 手を離しても同じ速さで回り続ける
      apply();
    }
    if (zoomer.dir) {
      zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom * Math.exp(zoomer.dir * zoomer.hold(dt) * dt)));
      target = null;
      apply();
    } else if (zoomer.latch) {
      zoomLoop(dt);
      apply();
    } else if (zoomReturn) {
      zoomBack(dt);
      apply();
    }
  }

  // スティックを倒したままじっとしている時間を測り、つまみの周りの輪を伸ばす
  function chargeStick(dt) {
    const moved = !stickAnchor || Math.hypot(stickVec.x - stickAnchor.x, stickVec.y - stickAnchor.y) > STICK_STILL;
    if (moved || Math.hypot(stickVec.x, stickVec.y) <= 0.05) {  // 動かした・ほとんど倒していない → 測り直し
      stickAnchor = { ...stickVec };
      stickStill = 0;
    } else {
      stickStill += dt;
    }
    const p = Math.min(1, Math.max(0, (stickStill - STICK_WAIT) / STICK_FILL));
    stick.classList.toggle('charging', stickStill > STICK_WAIT);
    showRing(stick, p);
    if (p >= 1 && !stickReady) navigator.vibrate?.(30);  // 一周した (離せばロック)
    stickReady = p >= 1;
  }

  function stopStickLatch() {
    if (!stickLatch) return;
    stickLatch = null;
    stick.classList.remove('latched');
    if (!stickVec) knob.style.transform = '';
  }

  // 使い始めの合図: 最初は光らせ、初めて触ったらやめて、ドラッグでも回せることを 1 回だけ教える
  function firstUse() {
    pad.classList.remove('blink');  // 触ったら光るのをやめる
    if (!pad.classList.contains('untouched')) return;
    pad.classList.remove('untouched');
    store.set('3d-browser-pad-used', '1');
    padHint.classList.add('show');
    setTimeout(() => padHint.classList.remove('show'), 3500);
  }

  function setStick(e) {
    const r = stick.getBoundingClientRect();
    const R = r.width / 2;
    let x = (e.clientX - r.left - R) / R, y = (e.clientY - r.top - R) / R;
    const m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; }
    stickVec = { x, y };
    knob.style.transform = `translate(${x * R * 0.62}px, ${y * R * 0.62}px)`;
  }
  stick.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    stick.setPointerCapture(e.pointerId);
    stick.classList.add('active');
    firstUse();
    stopStickLatch();  // ロック中なら外して、そのまま普通に操作する
    stickAnchor = null;
    stickStill = 0;
    stickReady = false;
    setStick(e);
  });
  stick.addEventListener('pointermove', (e) => { if (stickVec) setStick(e); });
  // 離したとき: 輪が一周していたら、その位置でロック (つまみはその場に残る)。それ以外は中心へ戻る
  const stickUp = (e) => {
    if (!stickVec) return;
    const lock = stickReady && e.type === 'pointerup' && stickVec;
    stickVec = null;
    stickReady = false;
    stick.classList.remove('active', 'charging');
    showRing(stick, 0);
    if (lock) {
      stickLatch = lock;
      stick.classList.add('latched');
      vx = vy = 0;
    } else {
      knob.style.transform = '';
    }
  };
  stick.addEventListener('pointerup', stickUp);
  stick.addEventListener('pointercancel', stickUp);

  // 矢印キー (文字を入力しているときは効かない)
  const KEYS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const held = new Set();
  const typing = (el) => el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
  function syncKeys() {
    keyVec = { x: 0, y: 0 };
    for (const k of held) { keyVec.x += KEYS[k][0] * 0.6; keyVec.y += KEYS[k][1] * 0.6; }
  }
  addEventListener('keydown', (e) => {
    if (!KEYS[e.key] || typing(document.activeElement) || e.altKey || e.ctrlKey || e.metaKey) return;
    e.preventDefault();
    stopStickLatch();  // 矢印キーで回したら、スティックで回し続けるのをやめる
    held.add(e.key);
    syncKeys();
  });
  addEventListener('keyup', (e) => { if (held.delete(e.key)) syncKeys(); });
  addEventListener('blur', () => { held.clear(); syncKeys(); });

  // 隠す / 表示する (次回も覚えておく)。入れ子の中ではごちゃごちゃするので出さない
  function showPad(on, remember = true) {
    pad.hidden = !on;
    padShow.hidden = on;
    if (remember) store.set('3d-browser-pad-hidden', on ? '' : '1');
    layoutPad();
  }
  // パネルが右下のボタンと重なるなら、ボタンの上に持ち上げる
  function layoutPad() {
    if (pad.hidden) return;
    pad.style.bottom = padHint.style.bottom = '';
    const a = pad.getBoundingClientRect(), c = document.getElementById('controls').getBoundingClientRect();
    if (a.right + 8 > c.left && a.bottom > c.top - 8) {
      // ボタンの列 (折り返して 2 段になることもある) のすぐ上に置く
      const bottom = innerHeight - c.top + 10;
      pad.style.bottom = `${bottom}px`;
      padHint.style.bottom = `${bottom + a.height + 12}px`;
    }
  }
  addEventListener('resize', layoutPad);
  onLangChange.push(layoutPad);  // 言語でボタンの幅が変わる
  pad.querySelector('.pad-hide').addEventListener('click', () => showPad(false));
  padShow.addEventListener('click', () => showPad(true));
  padShow.dataset.i18nTitle = 'showPad';
  if (depth > 0) {
    pad.hidden = true;
    padShow.hidden = true;
  } else {
    // 最初の表示: 指で操作する端末ではパネルを出す。マウスのある PC では畳んでおき、
    // 代わりにヒントと軽い揺れで「ドラッグで回せる」ことを見せる。
    // 一度でも表示/非表示を切り替えた人は、その設定を優先する
    const saved = store.get('3d-browser-pad-hidden');
    const mouse = matchMedia('(pointer: fine)').matches;
    if (saved !== null) showPad(saved !== '1');
    else showPad(!mouse, false);
    if (!pad.hidden && !store.get('3d-browser-pad-used')) {
      pad.classList.add('untouched', 'blink');  // untouched: まだ触っていない (初回ヒント用)
      setTimeout(() => pad.classList.remove('blink'), 10000);  // 触らなくても 10 秒で光るのをやめる
    }
    if (saved === null && mouse && !store.get('3d-browser-drag-hinted')) {
      store.set('3d-browser-drag-hinted', '1');  // ヒントと揺れは最初の 1 回だけ
      showDragHint();
    }
  }

  // PC の初回だけ: 少し待ってから 3D ブラウザを軽く揺らし、ドラッグで回せることを知らせる
  function showDragHint() {
    padHint.textContent = t('dragHintFirst');
    padHint.dataset.i18n = 'dragHintFirst';
    // 揺らす前に何か操作していたら揺らさない (リセットや拡大縮小を上書きしないため)
    let touched = false;
    const mark = () => { touched = true; };
    for (const ev of ['pointerdown', 'wheel', 'keydown']) addEventListener(ev, mark, { capture: true, once: true });
    setTimeout(() => {
      if (touched || dragging || padActive() || target) return;
      padHint.classList.add('show');
      const r0 = rx, y0 = ry;
      turnTo(r0 - 4, y0 + 18, undefined, rz);
      setTimeout(() => { if (!touched && !dragging && !padActive()) turnTo(r0, y0, undefined, rz); }, 700);
      setTimeout(() => {
        padHint.classList.remove('show');
        padHint.textContent = t('dragHint');
        padHint.dataset.i18n = 'dragHint';
      }, 4500);
    }, 1200);
  }
  setLang(lang);

  // どの面にも右下に大きさを変えるつまみを付ける (ブラウザにしていない面にも)
  for (const face of box.querySelectorAll(OPENABLE)) addResizeGrip(face);

  // 最初は前面だけブラウザにしておく (最初の斜めの向きを保つため openFace は使わない)。
  // スタートページにプラグインのページも並べるので、プラグインの読み込みが終わってから開く
  const start = () => {
    makeBrowser(box.querySelector('.front')).addTab(createTab());
    apply();  // ブラウザになった面は陰を弱くする
  };
  if (document.readyState === 'loading') addEventListener('DOMContentLoaded', start);
  else start();
  apply();
  tick();
})();
</script>
