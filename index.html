  // face の中にブラウザを作る。タブがすべてなくなったら onEmpty を呼ぶ
  function createBrowser(face, { onEmpty, squash = false }) {
    face.classList.add('browser');
    let root = face;
    if (squash) {
      // 短い辺 (厚み) が SIDE_W になるようにレイアウトし、縦横同じ倍率で面の大きさまで縮める。
      // 長い辺は縮めたときに面の長さになるよう逆算する
      // (左右の面はとても縦長、上下の面はとても横長のブラウザになる)
      root = document.createElement('div');
      root.className = 'squash';
      const fit = () => {
        const s = Math.min(face.offsetWidth, face.offsetHeight) / SIDE_W;
        root.style.width = `${face.offsetWidth / s}px`;
        root.style.height = `${face.offsetHeight / s}px`;
        root.style.transform = `scale(${s})`;
      };
      fit();
      new ResizeObserver(fit).observe(face);  // ブラウザの大きさを変えたら縮め方も変える
      face.prepend(root);
    }
    root.insertAdjacentHTML('afterbegin', BROWSER_HTML);
    applyLang(root);
    const q = (sel) => face.querySelector(sel);
    const tabList = q('.tab-list'), panes = q('.panes'), address = q('.address');
    const backBtn = q('.back-btn'), fwdBtn = q('.fwd-btn');

    const browser = {
      face, tabs: [], active: null,

      addTab(tab) {
        tab.browser = browser;
        browser.tabs.push(tab);
        tabList.appendChild(tab.label);
        panes.appendChild(tab.pane);
        browser.activate(tab);
      },

      activate(tab) {
        browser.active = tab;
        for (const t of browser.tabs) {
          t.label.classList.toggle('active', t === tab);
          t.pane.hidden = t !== tab;
        }
        browser.sync(tab);
      },

      // タブを取り外す (移動にも使う)。閉じたタブの隣を表示する
      removeTab(tab) {
        const i = browser.tabs.indexOf(tab);
        browser.tabs.splice(i, 1);
        tab.label.remove();
        tab.pane.remove();
        tab.browser = null;
        if (!browser.tabs.length) return onEmpty();
        if (browser.active === tab) browser.activate(browser.tabs[Math.min(i, browser.tabs.length - 1)]);
      },

      closeTab(tab) {
        browser.removeTab(tab);
      },

      // アドレスバーと戻る/進むボタンを表示中のタブに合わせる
      sync(tab) {
        if (tab !== browser.active) return;
        if (document.activeElement !== address) address.value = tab.addr;
        backBtn.disabled = tab.index <= 0;
        fwdBtn.disabled = tab.index >= tab.history.length - 1;
      },
    };
    face._browser = browser;

    address.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) { navigate(browser.active, address.value); address.blur(); }
    });
    address.addEventListener('focus', () => address.select());
    backBtn.addEventListener('click', () => {
      const t = browser.active;
      if (t.index > 0) { t.index--; render(t); }
    });
    fwdBtn.addEventListener('click', () => {
      const t = browser.active;
      if (t.index < t.history.length - 1) { t.index++; render(t); }
    });
    q('.reload-btn').addEventListener('click', () => render(browser.active));
    q('.home-btn').addEventListener('click', () => {
      const t = browser.active;
      t.history.splice(t.index + 1); t.history.push(null); t.index = t.history.length - 1;
      render(t);
    });
    q('.new-tab').addEventListener('click', () => browser.addTab(createTab()));
    q('.close-window').addEventListener('click', onEmpty);  // タブごとブラウザを閉じる
    q('.min-window').addEventListener('click', () => toggleSizeMode('min'));
    q('.max-window').addEventListener('click', () => toggleSizeMode('max'));
    if (face.classList.contains('front')) addResizeGrip(face);
    return browser;
  }

  function moveTab(tab, to) {
    if (tab.browser === to) return;
    tab.browser.removeTab(tab);
    to.addTab(tab);
  }

  // ---------- face browsers ----------
  // ブラウザにできる面。側面は厚みに合わせて縮め、前面・背面はそのままの大きさで開く
  const OPENABLE = '.front, .side, .back';
  const FACING = { front: [0, 0], right: [-8, -72], left: [-8, 72], top: [-72, 0], bottom: [72, 0], back: [-8, 180] };

  function makeBrowser(face) {
    return createBrowser(face, { onEmpty: () => closeFace(face), squash: face.classList.contains('side') });
  }

  function openFace(face, tab = createTab()) {
    makeBrowser(face).addTab(tab);
    // 開いた面がこちらを向くように回す
    const [trx, try_] = FACING[Object.keys(FACING).find((c) => face.classList.contains(c))];
    turnTo(trx, try_);
  }

  // ブラウザを閉じて元の面に戻す。タブが残っていれば一緒に捨てる
  function closeFace(face) {
    face.classList.remove('browser');
    face._browser = null;
    for (const el of [...face.children]) {
      if (!el.classList.contains('shade') && !el.classList.contains('logo')) el.remove();
    }
  }

  // ---------- 3D rotation ----------
  let rx = -10, ry = 22;          // 現在の角度 (deg)
  let rz = 0;                     // 平行回転 (画面に対して時計回り = +)
  let vx = 0, vy = 0, vz = 0;     // 慣性
  let zoom = 1;
  let dragging = false, lastX = 0, lastY = 0, lastT = 0;
  let down = null;                // クリック判定用: 押した位置と要素
  let target = null;              // 自動で回すときの目標 { rx, ry, rz, zoom? }

  const ROT = () => `rotateZ(${rz}deg) rotateX(${rx}deg) rotateY(${ry}deg)`;

  const faces = [
    ['.front',  [0, 0, 1]], ['.back',   [0, 0, -1]],
    ['.right',  [1, 0, 0]], ['.left',   [-1, 0, 0]],
    ['.top',    [0, -1, 0]], ['.bottom', [0, 1, 0]],
  ].map(([sel, n]) => {
    const el = box.querySelector(sel);
    return { el, shade: el.querySelector('.shade'), n };
  });
  const L = normalize([-0.35, -0.55, 1]);  // 左上手前からの光

  function normalize(v) { const l = Math.hypot(...v); return v.map((x) => x / l); }

  function fitScale() {
    return Math.min(innerWidth * 0.82 / W, innerHeight * 0.78 / H) * zoom;
  }

  function apply() {
    box.style.transform = `scale(${fitScale()}) ${ROT()}`;
    // CSS は rotateY → rotateX → rotateZ の順で点に作用する
    const a = ry * Math.PI / 180, b = rx * Math.PI / 180, c = rz * Math.PI / 180;
    for (const f of faces) {
      const [x, y, z] = f.n;
      const x1 = x * Math.cos(a) + z * Math.sin(a);
      const z1 = -x * Math.sin(a) + z * Math.cos(a);
      const y2 = y * Math.cos(b) - z1 * Math.sin(b);
      const z2 = y * Math.sin(b) + z1 * Math.cos(b);
      const x3 = x1 * Math.cos(c) - y2 * Math.sin(c), y3 = x1 * Math.sin(c) + y2 * Math.cos(c);
      const lit = Math.max(0, x3 * L[0] + y3 * L[1] + z2 * L[2]);
      // ブラウザになっている面は読みやすさ優先で陰を弱くする
      const k = f.el.classList.contains('browser') ? 0.25 : 0.5;
      f.shade.style.opacity = ((1 - lit) * k).toFixed(3);
    }
  }

  // 平行回転は指定しなければ 0° (まっすぐ) に戻す
  // ⟲⟳ の長押しロックを外す (操作パネルの処理は後ろで定義されるが、呼ばれるのは起動後の操作のときだけ)
  function stopRollLatch() { setLatch(0); }
  function turnTo(trx, try_, tzoom, trz = 0) {
    target = { rx: trx, ry: try_, rz: trz, zoom: tzoom };
    vx = vy = vz = 0;
  }

  // ---------- ブラウザの大きさ ----------
  // 見た目の倍率は元の大きさ (W × H) を基準に固定しているので、大きくすると見た目も大きくなる
  // (実際のウィンドウと同じ)。大きさは覚えず、開くたびに元の大きさから始まる
  const MIN_W = 320, MIN_H = 220, MAX_W = 4000, MAX_H = 6000;
  const TALL_W = 420, TALL_H = 2600;  // 超縦長
  let boxW = W, boxH = H;
  let sizeMode = 'normal', savedSize = null;  // 最大化・最小化の前の大きさ
  let sizeAnim = 0;

  function applySize() {
    document.documentElement.style.setProperty('--W', `${boxW}px`);
    document.documentElement.style.setProperty('--H', `${boxH}px`);
  }
  // animate: なめらかに変える (約 0.35 秒)
  function setSize(w, h, animate = false) {
    w = Math.round(Math.min(MAX_W, Math.max(MIN_W, w)));
    h = Math.round(Math.min(MAX_H, Math.max(MIN_H, h)));
    cancelAnimationFrame(sizeAnim);
    if (!animate) { boxW = w; boxH = h; applySize(); return; }
    const w0 = boxW, h0 = boxH, t0 = performance.now();
    (function step(now) {
      const k = Math.min(1, (now - t0) / 350), e = 1 - (1 - k) ** 3;
      boxW = w0 + (w - w0) * e; boxH = h0 + (h - h0) * e;
      applySize();
      if (k < 1) sizeAnim = requestAnimationFrame(step);
    })(t0);
  }
  // 拡大縮小していないときの見た目の倍率
  const baseScale = () => Math.min(innerWidth * 0.82 / W, innerHeight * 0.78 / H);

  // 緑 = 最大化 (画面いっぱい) / 黄 = 最小化。もう一度押すと元の大きさに戻る
  function toggleSizeMode(mode) {
    if (sizeMode === mode) {
      sizeMode = 'normal';
      setSize(savedSize.w, savedSize.h, true);
      return;
    }
    if (sizeMode === 'normal') savedSize = { w: boxW, h: boxH };
    sizeMode = mode;
    if (mode === 'max') {
      const s = baseScale();
      setSize(innerWidth * 0.96 / s, innerHeight * 0.9 / s, true);
      turnTo(0, 0, 1);  // 正面を向けて画面いっぱいに見せる
    } else {
      setSize(360, 240, true);
    }
  }
  addEventListener('resize', () => { if (sizeMode === 'max') { sizeMode = 'normal'; toggleSizeMode('max'); } });

  // 超縦長: 縦に長い箱を正面に向け、全体が見えるまで引く
  // プリセットの大きさにして正面を向け、全体が見える大きさまで引く (大きいときだけ)
  function setPreset(w, h, mode = 'preset') {
    if (sizeMode === 'normal') savedSize = { w: boxW, h: boxH };
    sizeMode = mode;
    setSize(w, h, true);
    const s = baseScale();
    turnTo(0, 0, Math.max(0.15, Math.min(1, innerWidth * 0.9 / (w * s), innerHeight * 0.85 / (h * s))));
  }
  const setTall = () => setPreset(TALL_W, TALL_H, 'tall');

  // 「サイズ」メニュー
  const SIZE_PRESETS = [
    ['sizePhone', 390, 844], ['sizeTablet', 820, 1180], ['sizeLaptop', W, H],
    ['sizeWide', 1400, 600], ['sizeSquare', 800, 800], ['sizeTall', TALL_W, TALL_H], ['sizeMax'],
  ];
  const sizeMenu = $('sizeMenu'), sizeBtn = $('sizeBtn');
  function renderSizeMenu() {
    sizeMenu.innerHTML = '';
    for (const [key, w, h] of SIZE_PRESETS) {
      const b = document.createElement('button');
      b.setAttribute('role', 'menuitem');
      b.innerHTML = `<span>${t(key)}</span><small>${w ? `${w} × ${h}` : ''}</small>`;
      if (w && Math.round(boxW) === w && Math.round(boxH) === h) b.classList.add('current');
      b.addEventListener('click', () => {
        sizeMenu.hidden = true;
        if (!w) { if (sizeMode !== 'max') toggleSizeMode('max'); return; }
        if (w === W && h === H) { resetAll(); return; }  // 標準の大きさ = リセットと同じ
        setPreset(w, h, key === 'sizeTall' ? 'tall' : 'preset');
      });
      sizeMenu.appendChild(b);
    }
  }
  sizeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (sizeMenu.hidden) renderSizeMenu();
    sizeMenu.hidden = !sizeMenu.hidden;
  });
  // メニューの外を押すか Esc で閉じる
  addEventListener('pointerdown', (e) => {
    if (!sizeMenu.hidden && !sizeMenu.contains(e.target) && e.target !== sizeBtn) sizeMenu.hidden = true;
  }, true);
  addEventListener('keydown', (e) => { if (e.key === 'Escape') sizeMenu.hidden = true; });

  function resetAll() {
    stopRollLatch();
    sizeMode = 'normal';
    setSize(W, H, true);
    turnTo(0, 0, 1);
  }

  // 右下の角のつまみ。箱を傾けていても、マウスの動きを面の上の動きに直して大きさを変える
  function addResizeGrip(face) {
    const grip = document.createElement('div');
    grip.className = 'resize-grip';
    grip.dataset.i18nTitle = 'resizeTip';
    grip.title = t('resizeTip');
    // 面の上の 3 点 (右下の角、そこから左に 100px、上に 100px) が画面のどこに映るかで、
    // つまみのあたりでの面の向きを調べる (遠近感があるので、つまみの近くで測る)
    const probes = [[0, 0], [100, 0], [0, 100]].map(([x, y]) => {
      const p = document.createElement('div');
      p.className = 'resize-probe';
      p.style.right = `${x}px`; p.style.bottom = `${y}px`;
      face.appendChild(p);
      return p;
    });
    face.appendChild(grip);
    let last = null;
    grip.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.stopPropagation();
      grip.setPointerCapture(e.pointerId);
      last = { x: e.clientX, y: e.clientY };
      sizeMode = 'normal';
      document.body.classList.add('resizing');
    });
    grip.addEventListener('pointermove', (e) => {
      if (!last) return;
      const [p0, p1, p2] = probes.map((p) => p.getBoundingClientRect());
      const ex = [(p0.x - p1.x) / 100, (p0.y - p1.y) / 100], ey = [(p0.x - p2.x) / 100, (p0.y - p2.y) / 100];
      const dx = e.clientX - last.x, dy = e.clientY - last.y;
      const det = ex[0] * ey[1] - ex[1] * ey[0];
      last = { x: e.clientX, y: e.clientY };
      if (Math.abs(det) < 1e-3) return;  // 面が真横を向いているときは動かせない
      const u = (dx * ey[1] - dy * ey[0]) / det, v = (ex[0] * dy - ex[1] * dx) / det;
      // 箱は中心を基準に広がるので、角がカーソルについてくるよう 2 倍にする
      setSize(boxW + u * 2, boxH + v * 2);
    });
    const end = () => { last = null; document.body.classList.remove('resizing'); };
    grip.addEventListener('pointerup', end);
    grip.addEventListener('pointercancel', end);
  }

  // 平行回転のドラッグ: 画面の中心からこの距離より外の背景をつかむと平行回転になる。
  // 縮小して箱が小さいときは、その分内側の円も小さくする
  let dragMode = 'tilt', lastAngle = 0;
  const rollRadius = () => 0.4 * Math.min(innerWidth, innerHeight) * Math.min(1, zoom);
  const rollGuide = $('rollGuide');
  function showRollGuide(on) {
    if (on) {
      const r = rollRadius();
      Object.assign(rollGuide.style, { width: `${r * 2}px`, height: `${r * 2}px` });
    }
    rollGuide.classList.toggle('show', on);
  }

  // 操作できる要素やページ表示部分の上では回転しない
  const interactive = (el) => el.closest('input, button, a, .panes, .tab, .resize-grip');

  // ---------- tab drag ----------
  // タブをドラッグして、別のブラウザや閉じている側面へ移動する
  let tabDrag = null;   // { tab, x, y, ghost, over }

  function dropTargetAt(x, y) {
    const face = document.elementFromPoint(x, y)?.closest(OPENABLE);
    if (!face) return null;
    if (face.classList.contains('browser')) return face._browser === tabDrag.tab.browser ? null : face;
    return face;  // 閉じている側面
  }

  function setDropTarget(face) {
    if (tabDrag.over === face) return;
    tabDrag.over?.classList.remove('drop-target');
    face?.classList.add('drop-target');
    tabDrag.over = face;
  }

  // ---------- pinch (スマホの 2 本指で拡大縮小・ひねって平行回転) ----------
  // 回転・タブのドラッグより先に受けて、2 本目の指が触れたらそちらを取り消す
  const touches = new Map();   // pointerId -> { x, y }
  let pinch = null;            // { d0, z0 }
  const touchDist = () => {
    const [a, b] = [...touches.values()];
    return Math.hypot(a.x - b.x, a.y - b.y) || 1;
  };
  const touchAngle = () => {
    const [a, b] = [...touches.values()];
    return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
  };
  scene.addEventListener('pointerdown', (e) => {
    // 1 本目がページの中 (スクロールや操作) なら対象外。2 本目はどこに触れてもよい
    if (e.pointerType !== 'touch' || (!touches.size && e.target.closest('.panes'))) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size !== 2) return;
    e.stopImmediatePropagation();
    // 1 本目で始まっていた回転やタブのドラッグはやめる
    dragging = false; down = null; vx = vy = vz = 0;
    showRollGuide(false);
    if (tabDrag) { tabDrag.ghost?.remove(); tabDrag.over?.classList.remove('drop-target'); tabDrag = null; }
    document.body.classList.remove('dragging');
    stopRollLatch();
    pinch = { d0: touchDist(), z0: zoom, a0: touchAngle(), r0: rz };
    target = null;
  });
  scene.addEventListener('pointermove', (e) => {
    if (!touches.has(e.pointerId)) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!pinch || touches.size < 2) return;
    e.stopImmediatePropagation();
    zoom = Math.min(2.5, Math.max(0.15, pinch.z0 * touchDist() / pinch.d0));
    rz = pinch.r0 + angleDiff(touchAngle(), pinch.a0);  // ひねった分だけ平行回転
    apply();
  });
  const endTouch = (e) => {
    if (!touches.delete(e.pointerId)) return;
    if (pinch) {
      e.stopImmediatePropagation();  // 指を離しても「クリック」扱いにしない
      if (touches.size < 2) pinch = null;
    }
  };
  scene.addEventListener('pointerup', endTouch);
  scene.addEventListener('pointercancel', endTouch);

  scene.addEventListener('pointerdown', (e) => {
    const label = e.target.closest('.tab');
    if (e.button === 0 && label && !e.target.closest('.close')) {
      tabDrag = { tab: label._tab, x: e.clientX, y: e.clientY, ghost: null, over: null };
      scene.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button !== 0 || interactive(e.target)) return;
    dragging = true; target = null;
    vx = vy = vz = 0;
    lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
    down = { x: e.clientX, y: e.clientY, el: e.target };
    // 箱の外の背景で、画面の中心から離れた所をつかんだら平行回転 (つまみを回すように)
    const cx = innerWidth / 2, cy = innerHeight / 2;
    dragMode = !e.target.closest('.face') && Math.hypot(e.clientX - cx, e.clientY - cy) > rollRadius() ? 'roll' : 'tilt';
    if (dragMode === 'roll') {
      stopRollLatch();  // 手でロールしたら、回し続けるのをやめる
      lastAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
      showRollGuide(true);
    }
    scene.setPointerCapture(e.pointerId);
    document.body.classList.add('dragging');
  });
  scene.addEventListener('pointermove', (e) => {
    if (tabDrag) {
      if (!tabDrag.ghost) {
        if (Math.hypot(e.clientX - tabDrag.x, e.clientY - tabDrag.y) < 5) return;
        tabDrag.ghost = document.createElement('div');
        tabDrag.ghost.className = 'tab-ghost';
        tabDrag.ghost.textContent = tabDrag.tab.title;
        document.body.appendChild(tabDrag.ghost);
        document.body.classList.add('dragging');
      }
      tabDrag.ghost.style.transform = `translate(${e.clientX + 12}px, ${e.clientY + 8}px)`;
      setDropTarget(dropTargetAt(e.clientX, e.clientY));
      return;
    }
    if (!dragging) {
      // マウスを乗せただけのとき: 平行回転になる場所ならカーソルを回転の矢印にする
      const roll = e.pointerType === 'mouse' && !e.target.closest('.face') &&
        Math.hypot(e.clientX - innerWidth / 2, e.clientY - innerHeight / 2) > rollRadius();
      document.body.classList.toggle('roll-zone', roll);
      return;
    }
    const now = performance.now();
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    const dt = Math.max(1, now - lastT);
    if (dragMode === 'roll') {
      // 画面の中心のまわりで、つかんだ点が回った角度だけ回す
      const a = Math.atan2(e.clientY - innerHeight / 2, e.clientX - innerWidth / 2);
      const d = angleDiff(a * 180 / Math.PI, lastAngle * 180 / Math.PI);
      rz += d;
      vz = d / dt * 16;
      lastAngle = a;
      lastX = e.clientX; lastY = e.clientY; lastT = now;
      apply();
      return;
    }
    ry += dx * 0.4; rx -= dy * 0.4;
    vy = dx * 0.4 / dt * 16; vx = -dy * 0.4 / dt * 16;
    lastX = e.clientX; lastY = e.clientY; lastT = now;
    apply();
  });
  function endTabDrag(e) {
    const { tab, ghost, over } = tabDrag;
    tabDrag = null;
    if (!ghost) {  // 動かさずに離した = タブの切り替え
      tab.browser.activate(tab);
      return;
    }
    ghost.remove();
    over?.classList.remove('drop-target');
    document.body.classList.remove('dragging');
    if (e.type !== 'pointerup' || !over) return;
    if (over.classList.contains('browser')) {
      moveTab(tab, over._browser);
    } else {
      tab.browser.removeTab(tab);
      openFace(over, tab);
    }
  }

  const endDrag = (e) => {
    if (tabDrag) return endTabDrag(e);
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('dragging');
    showRollGuide(false);
    if (performance.now() - lastT > 80) vx = vy = vz = 0;  // 止めてから離した場合は慣性なし
    // ほとんど動かさずに離した = クリック。側面ならブラウザを開く
    if (e.type === 'pointerup' && down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 4) {
      const side = down.el.closest(OPENABLE);
      if (side && !side.classList.contains('browser')) openFace(side);
    }
    down = null;
  };
  scene.addEventListener('pointerup', endDrag);
  scene.addEventListener('pointercancel', endDrag);

  scene.addEventListener('dblclick', (e) => {
    // 閉じている面のダブルクリックは「開く」操作なので、向きのリセットはしない
    const face = e.target.closest(OPENABLE);
    if (interactive(e.target) || (face && !face.classList.contains('browser'))) return;
    resetAll();
  });

  scene.addEventListener('wheel', (e) => {
    // Ctrl+ホイール / ピンチは、どこでもブラウザ自体の拡大ではなく 3D の拡大縮小にする
    if (!e.ctrlKey && interactive(e.target)) return;
    e.preventDefault();
    zoom = Math.min(2.5, Math.max(0.15, zoom * Math.exp(-e.deltaY * 0.001)));
    apply();
  }, { passive: false });

  addEventListener('resize', apply);

  // 角度の差を -180〜180 に収める (最短方向で回すため)
  const angleDiff = (to, from) => ((to - from) % 360 + 540) % 360 - 180;

  function tick() {
    padTick();
    if (!dragging && !padActive()) {
      if (target) {
        const drx = angleDiff(target.rx, rx), dry = angleDiff(target.ry, ry), drz = angleDiff(target.rz, rz);
        rx += drx * 0.12; ry += dry * 0.12; rz += drz * 0.12;
        if (target.zoom !== undefined) zoom += (target.zoom - zoom) * 0.12;
        if (Math.abs(drx) < 0.05 && Math.abs(dry) < 0.05 && Math.abs(drz) < 0.05 &&
            (target.zoom === undefined || Math.abs(zoom - target.zoom) < 0.002)) {
          rx = target.rx; ry = target.ry; rz = target.rz;
          if (target.zoom !== undefined) zoom = target.zoom;
          target = null;
        }
        apply();
      } else if (Math.abs(vx) > 0.01 || Math.abs(vy) > 0.01 || Math.abs(vz) > 0.01) {
        rx += vx; ry += vy; rz += vz;
        vx *= 0.95; vy *= 0.95; vz *= 0.95;
        apply();
      }
    }
    requestAnimationFrame(tick);
  }

  $('seeThrough').addEventListener('click', () => document.body.classList.toggle('see-through'));
  $('resetView').addEventListener('click', () => resetAll());

  // 全画面表示。iPhone の Safari は動画以外の全画面に対応していないので、そのときはボタンを出さない
  const root = document.documentElement;
  const requestFs = root.requestFullscreen || root.webkitRequestFullscreen;
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
  const fsBtn = $('fullscreen');
  if (!requestFs || depth > 0) {
    fsBtn.hidden = true;
  } else {
    fsBtn.addEventListener('click', () => {
      if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else requestFs.call(root);
    });
    const sync = () => { fsBtn.textContent = t(fsElement() ? 'exitFullscreen' : 'fullscreen'); };
    sync();
    onLangChange.push(sync);
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
  }

  // 日本語 ⇄ English の切り替え
  const langBtn = $('langToggle');
  function setLang(next) {
    lang = next;
    try { localStorage.setItem(LANG_KEY, lang); } catch {}
    document.documentElement.lang = lang;
    langBtn.textContent = t('langToggle');
    langBtn.title = t('langToggleTip');
    applyLang();
    for (const fn of onLangChange) fn();
    // 開いているタブ: 文字だけのページは描き直し、動いているページ (小人など) は題名だけ変える
    for (const label of document.querySelectorAll('.tab')) {
      const tab = label._tab, entry = tab?.history[tab.index];
      if (!tab) continue;
      if (!entry || entry.type === 'info' || entry.type === 'search') render(tab);
      else if (entry.type === 'draw') setMeta(tab, t('draw'), tab.addr);
      else if (entry.type === 'horror') setMeta(tab, t('horror'), tab.addr);
      else if (entry.type === 'kobito') setMeta(tab, t('kobito'), tab.addr);
      else if (entry.type === 'self') setMeta(tab, '3D Browser', tab.addr);
    }
  }
  langBtn.addEventListener('click', () => setLang(lang === 'ja' ? 'en' : 'ja'));

  // ---------- 操作パネル ----------
  // スティックを倒した向きに回る。中心から遠いほど速い (強さの 1.5 乗に比例)
  const pad = $('pad'), stick = pad.querySelector('.stick'), knob = pad.querySelector('.knob');
  const padShow = $('padShow'), padHint = $('padHint');
  const PAD_SPEED = 220;      // いっぱいに倒したときの回転の速さ (度/秒)
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };
  let stickVec = null;        // スティックを倒している量 { x, y } (-1〜1)。離しているときは null
  let keyVec = { x: 0, y: 0 };  // 矢印キーで倒している量
  let zoomDir = 0;            // ＋/− を押し続けている向き
  let rollDir = 0;            // ⟲/⟳ を押し続けている向き (時計回り = +)
  // ⟲/⟳ の回転の速さ (度/秒)。押し始めはゆっくりで、押し続けると少しずつ速くなる
  // 最高速は眺めやすさ優先で控えめ。速く回したいときは外側の背景を手でドラッグする (上限なし)
  const ROLL_MIN = 10, ROLL_MAX = 30, ROLL_RAMP = 2;  // ROLL_RAMP 秒で最高速
  let rollHeld = 0;           // ⟲/⟳ を押している時間 (秒)
  // 長押しロック: LATCH_HOLD 秒押し続けると、離してもそのときの速さのまま回り続ける
  const LATCH_HOLD = 3;
  let rollLatch = 0;          // ロック中の向き (時計回り = +、0 = ロックなし)
  let rollSpeed = 0;          // 今の ⟲⟳ の回る速さ (度/秒)。ロック中はこの速さを保つ
  const rollBtns = { '-1': pad.querySelector('.roll-left'), '1': pad.querySelector('.roll-right') };
  function setLatch(dir) {
    rollLatch = dir;
    for (const [d, b] of Object.entries(rollBtns)) b.classList.toggle('latched', +d === dir);
  }
  const showRing = (b, p) => b.style.setProperty('--p', p);
  let lastPadT = performance.now();
  const padActive = () => !!stickVec || keyVec.x || keyVec.y || zoomDir || rollDir;

  function padTick() {
    const now = performance.now(), dt = Math.min(0.05, (now - lastPadT) / 1000);
    lastPadT = now;
    const v = stickVec || keyVec;
    const m = Math.hypot(v.x, v.y);
    if (m > 0.05) {
      const k = PAD_SPEED * Math.pow(Math.min(1, m), 1.5) / m * dt;
      // 背景のドラッグと同じ向き: 右に倒すと右へ、上に倒すと上へ回る
      ry += v.x * k; rx -= v.y * k;
      target = null;
      // 離したときに少しだけ惰性で回り続けるよう、今の速さを覚えておく
      vy = v.x * k; vx = -v.y * k;
      apply();
    }
    if (rollDir) {
      rollHeld += dt;
      const b = rollBtns[rollDir];
      // 押し始めの短いタップではリングを出さない (0.3 秒過ぎてから伸ばし始める)
      showRing(b, rollLatch ? 0 : Math.max(0, (rollHeld - 0.3) / (LATCH_HOLD - 0.3)));
      if (!rollLatch && rollHeld >= LATCH_HOLD) {
        setLatch(rollDir);  // ロック。この先は一定の速さで回る
        showRing(b, 0);
        navigator.vibrate?.(30);
      }
      // ロックしても速さは変えない (押している間と同じ加速を続け、最高速で一定になる)
      const speed = rollSpeed = ROLL_MIN + (ROLL_MAX - ROLL_MIN) * Math.min(1, rollHeld / ROLL_RAMP);
      rz += rollDir * speed * dt;
      vz = 0;  // 離したらその場で止まる (惰性で行き過ぎないように)
      target = null;
      apply();
    } else if (rollLatch) {
      rz += rollLatch * rollSpeed * dt;  // 手を離しても同じ速さで回り続ける
      apply();
    }
    if (zoomDir) {
      zoom = Math.min(2.5, Math.max(0.15, zoom * Math.exp(zoomDir * 0.8 * dt)));
      target = null;
      apply();
    }
  }

  // 使い始めの合図: 最初は光らせ、初めて触ったらやめて、ドラッグでも回せることを 1 回だけ教える
  function firstUse() {
    pad.classList.remove('blink');  // 触ったら光るのをやめる
    if (!pad.classList.contains('untouched')) return;
    pad.classList.remove('untouched');
    store.set('3d-browser-pad-used', '1');
    padHint.classList.add('show');
    setTimeout(() => padHint.classList.remove('show'), 3500);
  }

  function setStick(e) {
    const r = stick.getBoundingClientRect();
    const R = r.width / 2;
    let x = (e.clientX - r.left - R) / R, y = (e.clientY - r.top - R) / R;
    const m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; }
    stickVec = { x, y };
    knob.style.transform = `translate(${x * R * 0.62}px, ${y * R * 0.62}px)`;
  }
  stick.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    stick.setPointerCapture(e.pointerId);
    stick.classList.add('active');
    firstUse();
    setStick(e);
  });
  stick.addEventListener('pointermove', (e) => { if (stickVec) setStick(e); });
  const stickUp = () => {
    stickVec = null;
    stick.classList.remove('active');
    knob.style.transform = '';
  };
  stick.addEventListener('pointerup', stickUp);
  stick.addEventListener('pointercancel', stickUp);

  // ＋/−: 押している間、拡大・縮小し続ける
  for (const [sel, dir] of [['.zoom-in', 1], ['.zoom-out', -1]]) {
    const b = pad.querySelector(sel);
    b.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      b.setPointerCapture(e.pointerId);
      firstUse();
      zoomDir = dir;
    });
    const stop = () => { zoomDir = 0; };
    b.addEventListener('pointerup', stop);
    b.addEventListener('pointercancel', stop);
  }

  // ⟲/⟳: 押している間、平行に回り続ける
  for (const [sel, dir] of [['.roll-left', -1], ['.roll-right', 1]]) {
    const b = pad.querySelector(sel);
    b.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      b.setPointerCapture(e.pointerId);
      firstUse();
      // ロック中の同じボタンを押したら止めるだけ。反対のボタンならロックを外して普通に回す
      if (rollLatch === dir) { setLatch(0); return; }
      setLatch(0);
      rollDir = dir;
      rollHeld = 0;
    });
    const stop = () => {
      if (rollDir) showRing(rollBtns[rollDir], 0);
      rollDir = 0;
    };
    b.addEventListener('pointerup', stop);
    b.addEventListener('pointercancel', stop);
  }

  // 矢印キー (文字を入力しているときは効かない)
  const KEYS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const held = new Set();
  const typing = (el) => el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
  function syncKeys() {
    keyVec = { x: 0, y: 0 };
    for (const k of held) { keyVec.x += KEYS[k][0] * 0.6; keyVec.y += KEYS[k][1] * 0.6; }
  }
  addEventListener('keydown', (e) => {
    if (!KEYS[e.key] || typing(document.activeElement) || e.altKey || e.ctrlKey || e.metaKey) return;
    e.preventDefault();
    held.add(e.key);
    syncKeys();
  });
  addEventListener('keyup', (e) => { if (held.delete(e.key)) syncKeys(); });
  addEventListener('blur', () => { held.clear(); syncKeys(); });

  // 隠す / 表示する (次回も覚えておく)。入れ子の中ではごちゃごちゃするので出さない
  function showPad(on, remember = true) {
    pad.hidden = !on;
    padShow.hidden = on;
    if (remember) store.set('3d-browser-pad-hidden', on ? '' : '1');
    layoutPad();
  }
  // パネルが右下のボタンと重なるなら、ボタンの上に持ち上げる
  function layoutPad() {
    if (pad.hidden) return;
    pad.style.bottom = padHint.style.bottom = '';
    const a = pad.getBoundingClientRect(), c = document.getElementById('controls').getBoundingClientRect();
    if (a.right + 8 > c.left && a.bottom > c.top - 8) {
      // ボタンの列 (折り返して 2 段になることもある) のすぐ上に置く
      const bottom = innerHeight - c.top + 10;
      pad.style.bottom = `${bottom}px`;
      padHint.style.bottom = `${bottom + a.height + 12}px`;
    }
  }
  addEventListener('resize', layoutPad);
  onLangChange.push(layoutPad);  // 言語でボタンの幅が変わる
  pad.querySelector('.pad-hide').addEventListener('click', () => showPad(false));
  padShow.addEventListener('click', () => showPad(true));
  padShow.dataset.i18nTitle = 'showPad';
  if (depth > 0) {
    pad.hidden = true;
    padShow.hidden = true;
  } else {
    // 最初の表示: 指で操作する端末ではパネルを出す。マウスのある PC では畳んでおき、
    // 代わりにヒントと軽い揺れで「ドラッグで回せる」ことを見せる。
    // 一度でも表示/非表示を切り替えた人は、その設定を優先する
    const saved = store.get('3d-browser-pad-hidden');
    const mouse = matchMedia('(pointer: fine)').matches;
    if (saved !== null) showPad(saved !== '1');
    else showPad(!mouse, false);
    if (!pad.hidden && !store.get('3d-browser-pad-used')) {
      pad.classList.add('untouched', 'blink');  // untouched: まだ触っていない (初回ヒント用)
      setTimeout(() => pad.classList.remove('blink'), 10000);  // 触らなくても 10 秒で光るのをやめる
    }
    if (saved === null && mouse && !store.get('3d-browser-drag-hinted')) {
      store.set('3d-browser-drag-hinted', '1');  // ヒントと揺れは最初の 1 回だけ
      showDragHint();
    }
  }

  // PC の初回だけ: 少し待ってから 3D ブラウザを軽く揺らし、ドラッグで回せることを知らせる
  function showDragHint() {
    padHint.textContent = t('dragHintFirst');
    padHint.dataset.i18n = 'dragHintFirst';
    // 揺らす前に何か操作していたら揺らさない (リセットや拡大縮小を上書きしないため)
    let touched = false;
    const mark = () => { touched = true; };
    for (const ev of ['pointerdown', 'wheel', 'keydown']) addEventListener(ev, mark, { capture: true, once: true });
    setTimeout(() => {
      if (touched || dragging || padActive() || target) return;
      padHint.classList.add('show');
      const r0 = rx, y0 = ry;
      turnTo(r0 - 4, y0 + 18, undefined, rz);
      setTimeout(() => { if (!touched && !dragging && !padActive()) turnTo(r0, y0, undefined, rz); }, 700);
      setTimeout(() => {
        padHint.classList.remove('show');
        padHint.textContent = t('dragHint');
        padHint.dataset.i18n = 'dragHint';
      }, 4500);
    }, 1200);
  }
  setLang(lang);

  // 最初は前面だけブラウザにしておく (最初の斜めの向きを保つため openFace は使わない)
  makeBrowser(box.querySelector('.front')).addTab(createTab());
  apply();
  tick();
})();
</script>
</body>
</html>
