    grip.addEventListener('pointerup', end);
    grip.addEventListener('pointercancel', end);
  }

  // 平行回転のドラッグ: 画面の中心からこの距離より外の背景をつかむと平行回転になる。
  // 縮小して箱が小さいときは、その分内側の円も小さくする
  let dragMode = 'tilt', ballR = 1;  // ballR: トラックボールの玉の半径 (画面の px)
  const ROLL_FROM = 0.6;              // 玉の半径のこの割合より内側ではロールを混ぜない
  const AXIS_DECIDE = 10, AXIS_SNAP = 25;  // 動き始めの何 px で向きを決めるか、真横・真上から何度以内ならその軸だけにするか
  let axisLock = null;                // このドラッグの回し方 ('roll' ロールだけ / 'x' 左右だけ / 'y' 上下だけ / 'free' 自由に傾ける)。null = まだ決めていない
  const rollRadius = () => 0.4 * Math.min(innerWidth, innerHeight) * Math.min(1, zoom);
  const rollGuide = $('rollGuide');
  function showRollGuide(on) {
    if (on) {
      const r = rollRadius(), [cx, cy] = boxCenter();
      Object.assign(rollGuide.style, { width: `${r * 2}px`, height: `${r * 2}px`, left: `${cx}px`, top: `${cy}px` });
    }
    rollGuide.classList.toggle('show', on);
  }

  // 操作できる要素やページ表示部分の上では回転しない
  // ページの中でも、ページが `.pass-drag` を付けた所 (スマホのホーム画面の空いた所など) のドラッグは箱を回す・パンする。
  // その中でも `.no-pass-drag` を付けた所はページが受ける
  const interactive = (el) => el.closest('input, button, a, .tab, .resize-grip') ||
    (el.closest('.panes') && (!el.closest('.pass-drag') || el.closest('.no-pass-drag')));

  // トラックボールの玉の半径: 画面に映る箱がすっぽり入る大きさ (箱の枠をつかんで回してもロールしないように)。
  // 箱が小さいときは、画面の短い辺の 0.4 倍
  function trackballR() {
    const hull = boxOutline(), xs = hull.map((q) => q[0]), ys = hull.map((q) => q[1]);
    return Math.max(rollRadius(), Math.hypot(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) / 2);
  }
  // 画面の点 (x, y) が、画面に映る箱の輪郭の中か、輪郭から near px 以内か
  function onBox(x, y, near = 0) {
    const hull = boxOutline(), [cx, cy] = boxCenter(), px = x - cx, py = y - cy;
    let pos = 0, neg = 0, dist = Infinity;
    hull.forEach(([ax, ay], i) => {
      const [bx, by] = hull[(i + 1) % hull.length], ex = bx - ax, ey = by - ay;
      const c = ex * (py - ay) - ey * (px - ax);  // 内側なら、どの辺から見ても同じ向き
      if (c > 0) pos++; else if (c < 0) neg++;
      const k = Math.max(0, Math.min(1, ((px - ax) * ex + (py - ay) * ey) / (ex * ex + ey * ey || 1)));
      dist = Math.min(dist, Math.hypot(px - ax - k * ex, py - ay - k * ey));
    });
    return !(pos && neg) || dist <= near;
  }
  // 拡大中か: 箱が画面からはっきり (画面の短い辺の ZOOMED_OVER 倍より多く) はみ出している。
  // 少しはみ出しているだけのときは、回転のまま (ドラッグのたびにパンと回転が入れ替わらないように)
  const ZOOMED_OVER = 0.1;
  function zoomedIn() {
    const hull = boxOutline(), [cx, cy] = boxCenter(), m = ZOOMED_OVER * Math.min(innerWidth, innerHeight);
    return hull.some(([x, y]) => cx + x < -m || cx + x > innerWidth + m || cy + y < -m || cy + y > innerHeight + m);
  }

  // ---------- tab drag ----------
  // タブをドラッグして、別のブラウザや閉じている側面へ移動する
  let tabDrag = null;   // { tab, x, y, ghost, over }

  function dropTargetAt(x, y) {
    const face = document.elementFromPoint(x, y)?.closest(OPENABLE);
    if (!face) return null;
    if (face.classList.contains('browser')) return face._browser === tabDrag.tab.browser ? null : face;
    return face;  // 閉じている側面
  }

  function setDropTarget(face) {
    if (tabDrag.over === face) return;
    tabDrag.over?.classList.remove('drop-target');
    face?.classList.add('drop-target');
    tabDrag.over = face;
  }

  // ---------- pinch (スマホの 2 本指で拡大縮小・ひねって平行回転) ----------
  // 回転・タブのドラッグより先に受けて、2 本目の指が触れたらそちらを取り消す
  const touches = new Map();   // pointerId -> { x, y }
  let pinch = null;            // { d0, z0, a0, r0, m, twisting }
  const TWIST_START = 12;      // ひねりがこの角度 (度) を超えるまではロールしない (ピンチ中の小さなひねりで回らないように)
  let touchStartRot = null;    // 1 本目の指が触れたときの向き。2 本目が来たら、1 本目で回した分を取り消す
  const touchDist = () => {
    const [a, b] = [...touches.values()];
    return Math.hypot(a.x - b.x, a.y - b.y) || 1;
  };
  const touchMid = () => {
    const [a, b] = [...touches.values()];
    return [(a.x + b.x) / 2, (a.y + b.y) / 2];
  };
  const touchAngle = () => {
    const [a, b] = [...touches.values()];
    return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;

  scene.addEventListener('pointerdown', (e) => {
    // 1 本目がページの中 (スクロールや操作) なら対象外 (ページが `.pass-drag` を付けた所は除く)。2 本目はどこに触れてもよい
    const inPage = e.target.closest('.panes') && (!e.target.closest('.pass-drag') || e.target.closest('.no-pass-drag'));
    if (e.pointerType !== 'touch' || (!touches.size && inPage)) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size !== 2) return;
    e.stopImmediatePropagation();
    // 1 本目で始まっていた回転やタブのドラッグはやめる。2 本の指は同時には触れないので、
    // 2 本目が来るまでに 1 本目で回してしまった分は元に戻す
    if (dragging && dragMode === 'tilt' && touchStartRot) ({ rx, ry, rz } = touchStartRot);
    dragging = false; down = null; vx = vy = vz = pvx = pvy = 0;
    showRollGuide(false);
    if (tabDrag) { tabDrag.ghost?.remove(); tabDrag.over?.classList.remove('drop-target'); tabDrag = null; }
    document.body.classList.remove('dragging');
    stopRollLatch();
    stopZoomLatch();
    pinch = { d0: touchDist(), z0: zoom, a0: touchAngle(), r0: rz, m: touchMid() };
    target = null;
  });
  scene.addEventListener('pointermove', (e) => {
    if (!touches.has(e.pointerId)) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!pinch || touches.size < 2) return;
    e.stopImmediatePropagation();
    // 指の真ん中を基準に拡大縮小し、指の真ん中が動いた分だけ視点を動かす
    const m = touchMid(), now = performance.now(), dt = Math.max(1, now - (pinch.t || now - 16));
    pvx = flingV(m[0] - pinch.m[0], dt); pvy = flingV(m[1] - pinch.m[1], dt);
    pinch.t = now;
    zoomAt(Math.min(2.5, Math.max(0.15, pinch.z0 * touchDist() / pinch.d0)), pinch.m[0], pinch.m[1]);
    const [px, py] = panPx();
    if (!noPan) setPan(px + m[0] - pinch.m[0], py + m[1] - pinch.m[1]);
    pinch.m = m;
    // ひねった分だけ平行回転。TWIST_START を超えてから、そこから先の分だけ回す (急に跳ねないように)
    const twist = angleDiff(touchAngle(), pinch.a0);
    if (!pinch.twisting && Math.abs(twist) > TWIST_START) {
      pinch.twisting = true;
      pinch.a0 += Math.sign(twist) * TWIST_START;
    }
    if (pinch.twisting && !noRotate) rz = pinch.r0 + angleDiff(touchAngle(), pinch.a0);
    apply();
  });
  const endTouch = (e) => {
    if (!touches.delete(e.pointerId)) return;
    if (pinch) {
      e.stopImmediatePropagation();  // 指を離しても「クリック」扱いにしない
      if (touches.size < 2) {
        if (performance.now() - (pinch.t || 0) > 80) pvx = pvy = 0;  // 止めてから離した場合は慣性なし
        pinch = null;
      }
    }
  };
  scene.addEventListener('pointerup', endTouch);
  scene.addEventListener('pointercancel', endTouch);

  scene.addEventListener('pointerdown', (e) => {
    const label = e.target.closest('.tab');
    if (e.button === 0 && label && !e.target.closest('.close')) {
      if (look) return;
      tabDrag = { tab: label._tab, x: e.clientX, y: e.clientY, ghost: null, over: null };
      scene.setPointerCapture(e.pointerId);
      return;
    }

    vx = vy = vz = pvx = pvy = 0;
    lastX = e.clientX; lastY = e.clientY; lastT = performance.now();

    touchStartRot = e.pointerType === 'touch' ? { rx, ry, rz } : null;
    axisLock = null;
    scene.setPointerCapture(e.pointerId);
    // 拡大中 (箱がはっきりはみ出している) は、地図のようにつかんで見る場所をずらす (パン)。判定はドラッグの始めだけ
    if (zoomedIn() || noRotate) {  // (回転禁止中の背景のドラッグはパン)
      dragMode = 'pan';
      document.body.classList.add('dragging', 'panning');
      return;
    }
    dragMode = 'tilt';
    ballR = trackballR();
    stopRollLatch();   // 手で回したら、回し続けるのをやめる
    stopStickLatch();
    document.body.classList.add('dragging');

  // ⟲⟳ と ＋/− の長押し。押し始めは stages[0] の速さで、STEP 秒ごとにリングが 1 段伸びて速くなる。
  // リングが出ているときに離すと、その段の速さのまま続ける (ロック。ボタンが青くなる)
  // wait: 押してからリングが出る (ロックできるようになる) までの秒数
  const STEP = 0.8;
  function holdGroup(btns, stages, wait = STEP) {
    const g = {
      btns, stages,
      dir: 0,     // 押している向き (0 = 押していない)
      held: 0,    // 押している時間 (秒)
      stage: 0,   // リングの段 (0 = まだリングが出ていない)
      latch: 0,   // ロック中の向き (0 = ロックなし)
      speed: 0,   // ロック中の速さ
      setLatch(dir) {
        const changed = g.latch !== dir;
        g.latch = dir;
        for (const [d, b] of Object.entries(btns)) b.classList.toggle('latched', +d === dir);
        if (changed) g.onLatch?.(dir);
      },
      // 押している間、毎フレーム呼ぶ。リングを伸ばし、今の速さを返す
      hold(dt) {
        g.held += dt;
        const b = btns[g.dir], n = stages.length;
        const stage = g.held < wait ? 0 : Math.min(n, 1 + Math.floor((g.held - wait) / STEP));
        if (stage !== g.stage) {
          g.stage = stage;
          b.classList.toggle('charging', stage > 0);
          navigator.vibrate?.(15);  // 段が上がるたびに軽く振動 (スマホ)
        }
        // リングは 1/3 の位置から現れて、一周までなめらかに伸びる
        if (stage) showRing(b, Math.min(1, (1 + (g.held - wait) / STEP) / n));
        return stages[Math.max(0, stage - 1)];
      },
    };
    for (const [d, b] of Object.entries(btns)) {
      const dir = +d;
      b.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        b.setPointerCapture(e.pointerId);
        firstUse();
        // ロック中の同じボタンを押したら止めるだけ。反対のボタンならロックを外して普通に動かす
        if (g.latch === dir) { g.setLatch(0); return; }
        g.setLatch(0);
        g.dir = dir;
        g.held = 0;
        g.stage = 0;
      });
      // 離したとき: リングが出ていたらその段の速さでロック、出ていなければ止まる
      const stop = (e) => {
        if (!g.dir) return;
        const btn = btns[g.dir];
        btn.classList.remove('charging');
        showRing(btn, 0);
        if (g.stage && e.type === 'pointerup') {
          g.speed = stages[g.stage - 1];
          g.setLatch(g.dir);
        }
        g.dir = 0;
        g.stage = 0;
      };
      b.addEventListener('pointerup', stop);
      b.addEventListener('pointercancel', stop);
    }
    return g;
  }
  const showRing = (b, p) => b.style.setProperty('--p', p);

  // ⟲/⟳ (度/秒)。最高速は眺めやすさ優先で控えめ。速く回したいときは外側の背景を手でドラッグする (上限なし)
  const roll = holdGroup({ '-1': pad.querySelector('.roll-left'), '1': pad.querySelector('.roll-right') }, [10, 20, 30]);
  // ＋/− (1 秒あたり大きさが e^速さ 倍)
  // 拡大縮小は押しっぱなしで使うことが多いので、⟲⟳ よりロックできるまでを長めにする
  const zoomer = holdGroup({ '1': pad.querySelector('.zoom-in'), '-1': pad.querySelector('.zoom-out') }, [0.3, 0.6, 1.0], 1.5);
  // ＋/− のロックはループする: 極大を越えて近づきながら消え、極小より遠くから現れてまた近づく (− は逆向き)
  // 手で拡大縮小できる範囲。ループのときだけ、その外 (LOOP_LO〜LOOP_HI) まで行く。
  // 遠い側は FADE_LO (点のような大きさ) まで小さくなってから消え、近い側は ZOOM_MAX を越えたら消えていく
  const ZOOM_MIN = 0.15, ZOOM_MAX = 2.5;
  const LOOP_LO = 0.01, FADE_LO = 0.03, LOOP_HI = 4;
  let zoomReturn = false;     // ループを止めたあと、範囲の中へなめらかに戻っている途中
  function zoomFade() {
    const fade = zoom > ZOOM_MAX ? 1 - Math.log(zoom / ZOOM_MAX) / Math.log(LOOP_HI / ZOOM_MAX)
      : zoom < FADE_LO ? 1 - Math.log(FADE_LO / zoom) / Math.log(FADE_LO / LOOP_LO) : 1;
    scene.style.opacity = fade < 1 ? Math.max(0, fade).toFixed(3) : '';
  }
  function zoomLoop(dt) {
    zoom *= Math.exp(zoomer.latch * zoomer.speed * dt);
    if (zoom > LOOP_HI) zoom = LOOP_LO * zoom / LOOP_HI;   // 突き抜けたら、遠くから出直す
    if (zoom < LOOP_LO) zoom = LOOP_HI * zoom / LOOP_LO;
    zoomFade();
  }
  // ボタンでループを止めたら、範囲の外にいれば中へなめらかに戻す
  zoomer.onLatch = (dir) => {
    if (!dir) zoomReturn = zoom < ZOOM_MIN || zoom > ZOOM_MAX;
  };
  function zoomBack(dt) {
    const to = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom));
    const d = Math.log(to / zoom);
    if (Math.abs(d) < 0.005) { zoom = to; zoomReturn = false; }
    else zoom *= Math.exp(d * Math.min(1, dt * 4));
    zoomFade();
  }

  let lastPadT = performance.now();
  const padActive = () => !!stickVec || !!panVec || keyVec.x || keyVec.y || zoomer.dir || roll.dir;

  // 回転のレバーを真横・真上に近い向き (STICK_SNAP 度以内) に倒したら、その軸ぴったりにそろえる (倒した量はそのまま)
  const STICK_SNAP = 20;
  function snapAxis(v) {
    const m = Math.hypot(v.x, v.y);
    if (m < 0.05) return v;
    const deg = Math.atan2(Math.abs(v.y), Math.abs(v.x)) * 180 / Math.PI;
    if (deg < STICK_SNAP) return { x: Math.sign(v.x) * m, y: 0 };
    if (deg > 90 - STICK_SNAP) return { x: 0, y: Math.sign(v.y) * m };
    return v;
  }
  function padTick() {
    const now = performance.now(), dt = Math.min(0.05, (now - lastPadT) / 1000);
    lastPadT = now;
    const v = snapAxis(stickVec || stickLatch || keyVec);
    const m = Math.hypot(v.x, v.y);
    if (m > 0.05) {
      const k = PAD_SPEED * Math.pow(Math.min(1, m), 1.5) / m * dt;
      // 背景のドラッグと同じ向き: 右に倒すと右へ、上に倒すと上へ回る
      tiltScreen(-v.y * k, v.x * k);  // 画面から見た向きで (逆さまでも右に倒せば右へ)
      if (flick && stickVec) { flick.ax += -v.y * k; flick.ay += v.x * k; }
      target = null;
      // 離したときに少しだけ惰性で回り続けるよう、今の速さを覚えておく (ロック中は惰性を使わない)
      if (stickLatch && !stickVec) vx = vy = 0;
      else { vy = v.x * k; vx = -v.y * k; }
      apply();
    }
    if (stickVec) chargeStick(dt);
    alignTick(dt);
    // はじいたあとの回転: 速く回り始めて、残りに比例してゆっくり止まる。背景をつかまれたらやめる
    if (spin) {
      if (dragging) spin = null;
      else {
        const step = Math.min(spin.left, Math.max(1.5, spin.left * 10 * dt));
        tiltScreen(spin.ax * step, spin.ay * step);
        spin.left -= step;
        if (spin.left <= 0.01) spin = null;
        target = null;
        vx = vy = 0;
        apply();
      }
    }
    // パン: 倒した方向へ箱 (見えているもの) が動く (Shift + 矢印とは逆向き)
    if (panVec && !noPan) {
      const pm = Math.hypot(panVec.x, panVec.y);
      if (pm > PAN_DEAD) {
        const k = PAN_SPEED / pm * dt, [px, py] = panPx();
        target = null;
        setPan(px + panVec.x * k, py + panVec.y * k);
        apply();
      }
    }
    // 触らずにしばらくたったら薄くする
    padIdle = padActive() || pad.classList.contains('blink') ? 0 : padIdle + dt;
    pad.classList.toggle('dim', padIdle > PAD_DIM);
    if (roll.dir && !noRotate) {
      rz += roll.dir * roll.hold(dt) * dt;
      vz = 0;  // 離したらその場で止まる (惰性で行き過ぎないように)
      target = null;
      apply();
    } else if (roll.latch && !noRotate) {
      rz += roll.latch * roll.speed * dt;  // 手を離しても同じ速さで回り続ける
      apply();
    }
    if (zoomer.dir && !noPan) {
      zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom * Math.exp(zoomer.dir * zoomer.hold(dt) * dt)));
      target = null;
      apply();
    } else if (zoomer.latch && !noPan) {
      zoomLoop(dt);
      apply();
    } else if (zoomReturn) {
      zoomBack(dt);
      apply();
    }
  }

  // スティックを倒したままじっとしている時間を測り、つまみの周りの輪を伸ばす
  function chargeStick(dt) {
    const moved = !stickAnchor || Math.hypot(stickVec.x - stickAnchor.x, stickVec.y - stickAnchor.y) > STICK_STILL;
    if (moved || Math.hypot(stickVec.x, stickVec.y) <= 0.05) {  // 動かした・ほとんど倒していない → 測り直し
      stickAnchor = { ...stickVec };
      stickStill = 0;
    } else {
      stickStill += dt;
    }
    const p = Math.min(1, Math.max(0, (stickStill - STICK_WAIT) / STICK_FILL));
    stick.classList.toggle('charging', stickStill > STICK_WAIT);
    showRing(stick, p);
    if (p >= 1 && !stickReady) navigator.vibrate?.(30);  // 一周した (離せばロック)
    stickReady = p >= 1;
  }

  function stopStickLatch() {
    spin = aligning = null;  // はじいて回している途中・軸合わせの途中も止める (リセットなど)
    if (!stickLatch) return;
    stickLatch = null;
    stick.classList.remove('latched');
    if (!stickVec) knob.style.transform = '';
  }

  // 使い始めの合図: 最初は光らせ、初めて触ったらやめて、ドラッグでも回せることを 1 回だけ教える
  function firstUse() {
    pad.classList.remove('blink');  // 触ったら光るのをやめる
    if (!pad.classList.contains('untouched')) return;
    pad.classList.remove('untouched');
    store.set('3d-browser-pad-used', '1');
    padHint.classList.add('show');
    setTimeout(() => padHint.classList.remove('show'), 3500);
  }

  function setStick(e) {
    const r = stick.getBoundingClientRect();
    const R = r.width / 2;
    let x = (e.clientX - r.left - R) / R, y = (e.clientY - r.top - R) / R;
    const m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; }
    stickVec = { x, y };
    if (flick && m > Math.hypot(flick.max.x, flick.max.y)) flick.max = { ...stickVec };
    knob.style.transform = `translate(${x * R * 0.62}px, ${y * R * 0.62}px)`;
  }
  stick.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    // ダブルクリック (ダブルタップ): 回転禁止の切り替え (2 回目の押し下げではレバーの操作を始めない)。
    // 1 回目の押し下げで回ってしまった分は、押す前の向き (rot) に戻す (2 本指の touchStartRot と同じ考え方)
    const now = performance.now();
    if (stickTap && now - stickTap.t < 350 && Math.hypot(e.clientX - stickTap.x, e.clientY - stickTap.y) < 20) {
      ({ rx, ry, rz } = stickTap.rot); vx = vy = vz = 0; apply();
      stickTap = null; setNoRotate(!noRotate); return;
    }
    stickTap = { t: now, x: e.clientX, y: e.clientY, rot: { rx, ry, rz } };
    stickDown = { x: e.clientX, y: e.clientY };
    stick.setPointerCapture(e.pointerId);
    stick.classList.add('active');
    firstUse();
    // はじいて回している途中なら止めて、残りを覚えておく (同じ向きにまたはじいたら、続けて回す)
    flick = { t0: performance.now(), max: { x: 0, y: 0 }, ax: 0, ay: 0, rest: spin };
    stopStickLatch();  // ロック中なら外して、そのまま普通に操作する
    stickAnchor = null;
    stickStill = 0;
    stickReady = false;
    setStick(e);
  });
  stick.addEventListener('pointermove', (e) => {
    if (!stickVec) return;
    // 禁止中にレバーを少しでも動かしたら解除 (そのまま回せる)
    if (noRotate && stickDown && Math.hypot(e.clientX - stickDown.x, e.clientY - stickDown.y) > 12) setNoRotate(false);
    setStick(e);
  });
  // 離したとき: 輪が一周していたら、その位置でロック (つまみはその場に残る)。それ以外は中心へ戻る
  const stickUp = (e) => {
    if (!stickVec) return;
    const lock = stickReady && e.type === 'pointerup' && stickVec;
    stickVec = null;
    stickReady = false;
    stick.classList.remove('active', 'charging');
    showRing(stick, 0);
    if (lock) {
      stickLatch = lock;
      stick.classList.add('latched');
      vx = vy = 0;
    } else {
      knob.style.transform = '';
      if (e.type === 'pointerup') flickSpin();
    }
    flick = null;
  };
  // はじいたか確かめて、そうなら軸の向きに 180 度回す (はじいている間に回った分は差し引く)
  function flickSpin() {
    const f = flick, v = f && snapAxis(f.max), m = f && Math.hypot(f.max.x, f.max.y);
    if (!f || (performance.now() - f.t0) / 1000 > FLICK_TIME || m < FLICK_REACH || (v.x && v.y)) return;
    const ax = -Math.sign(v.y), ay = Math.sign(v.x);  // 倒した向きに回す (padTick と同じ向き)
    const done = ax ? f.ax * ax : f.ay * ay;
    const rest = f.rest && f.rest.ax === ax && f.rest.ay === ay ? f.rest.left : 0;
    spin = { ax, ay, left: Math.max(0, FLICK_DEG - done) + rest };
    vx = vy = 0;
  }
  stick.addEventListener('pointerup', stickUp);
  stick.addEventListener('pointercancel', stickUp);

  // パンのレバー: 倒している間だけ動く (端で止まるので、ロックはしない)
  function setPanStick(e) {
    const r = panStick.getBoundingClientRect(), R = r.width / 2;
    let x = (e.clientX - r.left - R) / R, y = (e.clientY - r.top - R) / R;
    const m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; }
    panVec = { x, y };
    panKnob.style.transform = `translate(${x * R * 0.62}px, ${y * R * 0.62}px)`;
  }
  panStick.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    // ダブルクリック (ダブルタップ): パン禁止の切り替え
    const now = performance.now();
    // (1 回目の押し下げで動いてしまった分は、押す前の位置 (pan) に戻す)
    if (panTap && now - panTap.t < 350 && Math.hypot(e.clientX - panTap.x, e.clientY - panTap.y) < 20) {
      panU = panTap.pan; pvx = pvy = 0; apply();
      panTap = null; setNoPan(!noPan); return;
    }
    panTap = { t: now, x: e.clientX, y: e.clientY, pan: [...panU] };
    panDown = { x: e.clientX, y: e.clientY };
    panStick.setPointerCapture(e.pointerId);
    panStick.classList.add('active');
    firstUse();
    setPanStick(e);
  });
  panStick.addEventListener('pointermove', (e) => {
    if (!panVec) return;
    if (noPan && panDown && Math.hypot(e.clientX - panDown.x, e.clientY - panDown.y) > 12) setNoPan(false);  // 禁止中に少しでも動かしたら解除
    setPanStick(e);
  });
  const panUp = () => {
    panVec = null;
    panStick.classList.remove('active');
    panKnob.style.transform = '';
  };
  panStick.addEventListener('pointerup', panUp);
  panStick.addEventListener('pointercancel', panUp);
  // パネルに触ったら、薄くしていたのを戻す
  pad.addEventListener('pointerdown', () => { padIdle = 0; pad.classList.remove('dim'); }, true);

  // 矢印キー (文字を入力しているときは効かない)
  const KEYS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const held = new Set();
  const typing = (el) => el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
  function syncKeys() {
    keyVec = { x: 0, y: 0 };
    for (const k of held) { keyVec.x += KEYS[k][0] * 0.6; keyVec.y += KEYS[k][1] * 0.6; }
  }
  addEventListener('keydown', (e) => {
    if (!KEYS[e.key] || typing(document.activeElement) || e.altKey || e.ctrlKey || e.metaKey) return;
    if (keyCaptured()) return;  // ゲームなどがキーを使っている
    e.preventDefault();
    if (e.shiftKey) {  // 見る場所を少しずつ動かす (右を押すと右の方が見える)
      const [px, py] = panPx(), [kx, ky] = KEYS[e.key];
      if (!noPan) setPan(px - kx * 60, py - ky * 60);
      apply();
      return;
    }
    stopStickLatch();  // 矢印キーで回したら、スティックで回し続けるのをやめる
    held.add(e.key);
    syncKeys();
  });
  addEventListener('keyup', (e) => { if (held.delete(e.key)) syncKeys(); });
  // F: 全体、A: 軸合わせ
  addEventListener('keydown', (e) => {
    if (e.repeat || typing(document.activeElement) || e.altKey || e.ctrlKey || e.metaKey || keyCaptured()) return;
    const k = e.key.toLowerCase();
    if (k === 'f') fitView();
    else if (k === 'a') alignView();
    else return;
    e.preventDefault();
  });
  addEventListener('blur', () => { held.clear(); syncKeys(); });

  // 隠す / 表示する (次回も覚えておく)。入れ子の中ではごちゃごちゃするので出さない
  function showPad(on, remember = true) {
    pad.hidden = !on;
    padShow.hidden = on;
    if (remember) store.set('3d-browser-pad-hidden', on ? '' : '1');
    layoutPad();
  }
  // 右下のまとまりは、右下のボタンの列 (折り返して 2 段になることもある) の上に置く。
  // 高さが足りれば右下に縦一列 (CSS) なので列ごと、そうでなければ右側のまとまり (パンと拡大縮小) を持ち上げる。
  // 全体マップはいつも左上 (動かさない)
  const padColumn = matchMedia('(min-height: 560px)');
  function layoutPad() {
    padR.style.marginBottom = pad.style.bottom = '';
    if (pad.hidden) return;
    const c = $('controls').getBoundingClientRect(), padBottom = parseFloat(getComputedStyle(pad).bottom);
    if (padColumn.matches) {
      pad.style.bottom = `${Math.max(padBottom, innerHeight - c.top + 12)}px`;
      return;
    }
    padR.style.marginBottom = `${Math.max(0, innerHeight - c.top + 10 - padBottom)}px`;
  }
  addEventListener('resize', layoutPad);
  onLangChange.push(layoutPad);  // 言語でボタンの幅が変わる
  pad.querySelector('.pad-hide').addEventListener('click', () => showPad(false));
  padShow.addEventListener('click', () => showPad(true));
  padShow.dataset.i18nTitle = 'showPad';
  if (depth > 0) {
    pad.hidden = true;
    padShow.hidden = true;
  } else {
    // 最初の表示: 指で操作する端末ではパネルを出す。マウスのある PC では畳んでおき、
    // 代わりにヒントと軽い揺れで「ドラッグで回せる」ことを見せる。
    // 一度でも表示/非表示を切り替えた人は、その設定を優先する
    const saved = store.get('3d-browser-pad-hidden');
    const mouse = matchMedia('(pointer: fine)').matches;
    if (saved !== null) showPad(saved !== '1');
    else showPad(!mouse, false);
    if (!pad.hidden && !store.get('3d-browser-pad-used')) {
      pad.classList.add('untouched', 'blink');  // untouched: まだ触っていない (初回ヒント用)
      setTimeout(() => pad.classList.remove('blink'), 10000);  // 触らなくても 10 秒で光るのをやめる
    }
    // ?url= でページを指定して開いたときは、そのページを邪魔しないよう出さない
    if (saved === null && mouse && !startPage && !store.get('3d-browser-drag-hinted')) {
      store.set('3d-browser-drag-hinted', '1');  // ヒントと揺れは最初の 1 回だけ
      showDragHint();
    }
  }

  // PC の初回だけ: 少し待ってから 3D ブラウザを軽く揺らし、ドラッグで回せることを知らせる
  function showDragHint() {
    padHint.textContent = t('dragHintFirst');
    padHint.dataset.i18n = 'dragHintFirst';
    // 揺らす前に何か操作していたら揺らさない (リセットや拡大縮小を上書きしないため)
    let touched = false;
    const mark = () => { touched = true; };
    for (const ev of ['pointerdown', 'wheel', 'keydown']) addEventListener(ev, mark, { capture: true, once: true });
    setTimeout(() => {
      if (touched || dragging || padActive() || target) return;
      padHint.classList.add('show');
      const r0 = rx, y0 = ry;
      turnTo(r0 - 4, y0 + 18, undefined, rz);
      setTimeout(() => { if (!touched && !dragging && !padActive()) turnTo(r0, y0, undefined, rz); }, 700);
      setTimeout(() => {
        padHint.classList.remove('show');
        padHint.textContent = t('dragHint');
        padHint.dataset.i18n = 'dragHint';
      }, 4500);
    }, 1200);
  }
  setLang(lang);

  // どの面にも右下に大きさを変えるつまみを付ける (ブラウザにしていない面にも)
  for (const face of box.querySelectorAll(OPENABLE)) addResizeGrip(face);

  // 最初は前面だけブラウザにしておく (最初の斜めの向きを保つため openFace は使わない)。
  // スタートページにプラグインのページも並べるので、プラグインの読み込みが終わってから開く
  const start = () => {
    const tab = createTab();
    makeBrowser(box.querySelector('.front')).addTab(tab);
    apply();  // ブラウザになった面は陰を弱くする
    try {
      if (PAGES.has(startPage)) {  // 戻るとスタートページ
        instantStart = true;
        navigate(tab, `about:${startPage}`);
        instantStart = false;
      }
    } finally {
      document.documentElement.classList.remove('booting');  // 箱を見せる (head で隠していた)
    }
  };
  if (document.readyState === 'loading') addEventListener('DOMContentLoaded', start);
  else start();
  apply();
  tick();
})();
</script>
